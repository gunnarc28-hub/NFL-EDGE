<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="NFL matchups, injuries, 2+ week trends, prop projections and a pick tracker, refreshed every 30 minutes.">
<title>NFL Edge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Big+Shoulders+Display:wght@700;800;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: broadcast score bar in turf green with the yellow first-down stripe under it; white stat sheets below.
   Game cards sit in a two-up grid that stacks to one column on phones. The yellow stripe marks the betting line and model picks. */
:root{
  --bg:#EDF0EB; --panel:#FFFFFF; --panel-2:#F4F6F2; --ink:#111513; --ink-2:#46504A; --ink-3:#6E7A73;
  --rule:#D8DED8; --rule-2:#BFC8C1;
  --turf:#17462F; --turf-2:#21583C; --on-turf:#F4F7F2; --on-turf-2:#BCD0C2;
  --stripe:#F4C400; --stripe-ink:#6A5500; --on-stripe:#161300; --stripe-bg:#FFF5C7;
  --win:#16804A; --loss:#C2372C; --push:#76817B; --warn:#A86300; --info:#285DC0;
  --win-bg:#E2F2E8; --loss-bg:#FAE6E3; --warn-bg:#FBEFD9; --info-bg:#E4ECFA; --muted-bg:#ECEFEA;
  --spark-fill:rgba(17,21,19,.07);
  --shadow:0 1px 2px rgba(17,21,19,.05),0 3px 10px rgba(17,21,19,.05);
  --f-display:"Big Shoulders Display","Arial Narrow","Roboto Condensed",sans-serif;
  --f-body:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B100E; --panel:#131A17; --panel-2:#18211D; --ink:#EAF0EC; --ink-2:#AEB9B3; --ink-3:#7F8C85;
    --rule:#24302A; --rule-2:#34443C;
    --turf:#0E2A1C; --turf-2:#163A27; --on-turf:#EEF4EF; --on-turf-2:#9FB8A8;
    --stripe:#FFD21A; --stripe-ink:#FFD21A; --on-stripe:#161300; --stripe-bg:#2E2808;
    --win:#3DC17A; --loss:#F0695C; --push:#929D97; --warn:#F2A63A; --info:#86ACFF;
    --win-bg:#11301F; --loss-bg:#3A1A17; --warn-bg:#33260F; --info-bg:#162440; --muted-bg:#1C2622;
    --spark-fill:rgba(234,240,236,.08);
    --shadow:0 1px 2px rgba(0,0,0,.45),0 3px 12px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B100E; --panel:#131A17; --panel-2:#18211D; --ink:#EAF0EC; --ink-2:#AEB9B3; --ink-3:#7F8C85;
  --rule:#24302A; --rule-2:#34443C;
  --turf:#0E2A1C; --turf-2:#163A27; --on-turf:#EEF4EF; --on-turf-2:#9FB8A8;
  --stripe:#FFD21A; --stripe-ink:#FFD21A; --on-stripe:#161300; --stripe-bg:#2E2808;
  --win:#3DC17A; --loss:#F0695C; --push:#929D97; --warn:#F2A63A; --info:#86ACFF;
  --win-bg:#11301F; --loss-bg:#3A1A17; --warn-bg:#33260F; --info-bg:#162440; --muted-bg:#1C2622;
  --spark-fill:rgba(234,240,236,.08);
  --shadow:0 1px 2px rgba(0,0,0,.45),0 3px 12px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--info)}
:focus-visible{outline:2px solid var(--info);outline-offset:2px;border-radius:4px}
.num,.tab-num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono)}
h1,h2,h3{text-wrap:balance;margin:0}

/* ---------- score bar ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background-color:var(--turf);
  background-image:repeating-linear-gradient(90deg,transparent 0 calc(10% - 2px),rgba(255,255,255,.06) calc(10% - 2px) 10%);
  color:var(--on-turf);box-shadow:0 4px 0 var(--stripe)}
.bar-in{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:10px 0;display:flex;flex-direction:column;gap:6px}
.brand-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:900;font-size:32px;line-height:.9;letter-spacing:.01em;text-transform:uppercase}
.brand b{color:var(--stripe);font-weight:900}
.brand-meta{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--on-turf-2)}
.brand-meta strong{color:var(--on-turf);font-weight:600}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-inline:-6px}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;background:none;border:0;cursor:pointer;color:var(--on-turf-2);font-family:var(--f-display);font-weight:800;
  font-size:18px;letter-spacing:.03em;text-transform:uppercase;padding:8px 10px 10px;white-space:nowrap;border-bottom:4px solid transparent;margin-bottom:-4px}
.tab:hover{color:var(--on-turf)}
.tab[aria-selected="true"]{color:var(--on-turf);border-bottom-color:var(--on-turf)}
.tab .cnt{font-family:var(--f-mono);font-size:11px;font-weight:600;vertical-align:3px;margin-left:4px;color:var(--stripe)}

main{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:22px 64px}
.view{display:flex;flex-direction:column;gap:22px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.h2{font-family:var(--f-display);font-weight:800;font-size:26px;letter-spacing:.01em;text-transform:uppercase;line-height:1}
.h3{font-family:var(--f-display);font-weight:800;font-size:19px;letter-spacing:.02em;text-transform:uppercase;line-height:1.1}
.lede{color:var(--ink-2);max-width:68ch;margin:6px 0 0}
.small{font-size:12.5px;color:var(--ink-3)}
.label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}

/* ---------- chips, pills ---------- */
.tm{display:inline-flex;align-items:center;justify-content:center;min-width:40px;height:24px;padding:0 6px;border-radius:5px;
  background:var(--c1);color:var(--c2);font-family:var(--f-display);font-weight:900;font-size:15px;letter-spacing:.04em;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.tm.sm{min-width:34px;height:20px;font-size:13px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;line-height:1;padding:5px 8px;border-radius:999px;
  background:var(--muted-bg);color:var(--ink-2);white-space:nowrap}
.pill.win{background:var(--win-bg);color:var(--win)} .pill.loss{background:var(--loss-bg);color:var(--loss)}
.pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.info{background:var(--info-bg);color:var(--info)}
.pill.stripe{background:var(--stripe);color:var(--on-stripe)}
.pill.ghost{background:transparent;box-shadow:inset 0 0 0 1px var(--rule-2)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:currentColor}
.res{display:inline-flex;gap:3px;vertical-align:-1px}
.res i{width:9px;height:9px;border-radius:2px;display:inline-block}
.res i.W,.res i.O{background:var(--win)} .res i.L,.res i.U{background:var(--loss)} .res i.T,.res i.P{background:var(--push)}
.res i.n{background:transparent;box-shadow:inset 0 0 0 1px var(--rule-2)}

.btn{appearance:none;border:0;cursor:pointer;border-radius:7px;font-weight:700;font-size:13.5px;padding:8px 12px;
  background:var(--panel);color:var(--ink);box-shadow:inset 0 0 0 1px var(--rule-2)}
.btn:hover{box-shadow:inset 0 0 0 1px var(--ink-3)}
.btn.primary{background:var(--ink);color:var(--panel);box-shadow:none}
.btn.primary:hover{opacity:.9}
.btn.stripe{background:var(--stripe);color:var(--on-stripe);box-shadow:none}
.btn.tiny{font-size:12px;padding:5px 8px;border-radius:6px}
.btn.link{background:none;box-shadow:none;padding:4px 0;color:var(--info);font-weight:600}
.seg{display:inline-flex;flex-wrap:wrap;gap:6px}
.seg button{appearance:none;cursor:pointer;border:0;border-radius:999px;padding:6px 11px;font-size:13px;font-weight:600;
  background:var(--panel);color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--rule-2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel);box-shadow:none}
.star{appearance:none;background:none;border:0;cursor:pointer;font-size:16px;line-height:1;padding:2px 4px;color:var(--rule-2)}
.star[aria-pressed="true"]{color:var(--stripe-ink)}
select,input[type="number"],input[type="text"],textarea{background:var(--panel);border:1px solid var(--rule-2);border-radius:7px;padding:7px 9px;min-width:0}
select:focus,input:focus,textarea:focus{outline:2px solid var(--info);outline-offset:0;border-color:transparent}

/* ---------- my teams strip ---------- */
.glance{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:12px}
.gl{background:var(--panel);border-radius:10px;box-shadow:var(--shadow);padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.gl .big{font-family:var(--f-display);font-weight:900;font-size:30px;line-height:1}
.gl .t{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* ---------- game cards ---------- */
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,540px),1fr));gap:16px;align-items:start}
.game{background:var(--panel);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;min-width:0;display:flex;flex-direction:column}
.g-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;border-bottom:1px solid var(--rule);flex-wrap:wrap}
.g-when{font-weight:700;font-size:13px}
.g-where{font-size:12px;color:var(--ink-3)}
.g-flags{display:flex;gap:5px;flex-wrap:wrap}
.g-body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:12px}
.trow{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px}
.trow + .trow{margin-top:8px}
.tname{min-width:0}
.tname .n{font-weight:700;font-size:16px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.tname .n .rec{font-family:var(--f-display);font-weight:800;font-size:19px;letter-spacing:.02em}
.tname .meta{font-size:12px;color:var(--ink-3);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tline{text-align:right}
.tline .sp{font-family:var(--f-display);font-weight:900;font-size:24px;line-height:1}
.tline .ml{font-family:var(--f-mono);font-size:11.5px;color:var(--ink-3)}
.score{font-family:var(--f-display);font-weight:900;font-size:30px;line-height:1}
.score.lost{color:var(--ink-3)}

.wp{display:flex;flex-direction:column;gap:5px}
.wp-labels{display:flex;justify-content:space-between;gap:8px;font-size:12px;font-weight:600;color:var(--ink-2)}
@media (max-width:620px){.wp-mid{display:none}}
.wp-track{position:relative;height:12px;border-radius:3px;overflow:visible;display:flex;background:var(--muted-bg)}
.wp-track span{height:100%}
.wp-track span:first-child{border-radius:3px 0 0 3px} .wp-track span:last-child{border-radius:0 3px 3px 0}
.wp-mkt{position:absolute;top:-4px;bottom:-4px;width:4px;margin-left:-2px;background:var(--stripe);border-radius:1px;box-shadow:0 0 0 1px var(--panel)}
.model-line{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--ink-2)}
.model-line b{color:var(--ink)}
.pick-chip{display:inline-flex;align-items:center;gap:8px;background:var(--stripe);color:var(--on-stripe);border-radius:6px;padding:5px 9px;
  font-weight:700;font-size:13px}
.pick-chip .k{font-family:var(--f-display);font-weight:900;font-size:13px;letter-spacing:.06em;text-transform:uppercase;opacity:.8}
.nopick{font-size:12.5px;color:var(--ink-3)}

.tape{width:100%;border-collapse:collapse;font-size:13px}
.tape th{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);text-align:center;padding:0 4px 4px}
.tape th:first-child{text-align:left}
.tape td{padding:5px 4px;border-top:1px solid var(--rule);text-align:center;font-variant-numeric:tabular-nums}
.tape td:first-child{text-align:left;color:var(--ink-2)}
.rk{font-family:var(--f-mono);font-size:12px;font-weight:600;padding:2px 5px;border-radius:4px;color:var(--ink-2)}
.rk.good{background:var(--win-bg);color:var(--win)} .rk.bad{background:var(--loss-bg);color:var(--loss)}
.tape .better{font-weight:700;color:var(--ink)}
.tape .v{color:var(--ink-3);font-size:12px;margin-right:4px}

.g-chips{display:flex;flex-wrap:wrap;gap:6px}
.g-more{appearance:none;border:0;border-top:1px solid var(--rule);background:var(--panel-2);cursor:pointer;width:100%;padding:10px 14px;
  font-weight:700;font-size:13px;color:var(--ink-2);display:flex;justify-content:space-between;align-items:center}
.g-more:hover{color:var(--ink)}
.g-detail{border-top:1px solid var(--rule);padding:12px 14px 16px;display:flex;flex-direction:column;gap:12px;background:var(--panel)}
.twocol{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:14px}
.inj{display:flex;flex-direction:column;gap:2px;padding:7px 0;border-top:1px solid var(--rule)}
.inj:first-of-type{border-top:0}
.inj .top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.inj .who{font-weight:650;font-size:13.5px;min-width:0}
.inj .who small{font-weight:500;color:var(--ink-3)}
.inj .ol{font-size:12.5px;color:var(--ink-2)}
.inj .x{font-size:12px;font-weight:600;text-decoration:none;white-space:nowrap}
.lvl-out,.lvl-ir{background:var(--loss-bg);color:var(--loss)} .lvl-doubt,.lvl-risk{background:var(--warn-bg);color:var(--warn)}
.lvl-gtd{background:var(--info-bg);color:var(--info)} .lvl-likely,.lvl-ok{background:var(--win-bg);color:var(--win)}

.plist{display:flex;flex-direction:column}
.prow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1.25fr) auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--rule)}
.prow:first-child{border-top:0}
.prow .pn{font-weight:650;font-size:13.5px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.prow .ps{font-size:12px;color:var(--ink-3)}
.proj{font-family:var(--f-display);font-weight:900;font-size:21px;line-height:1}
.proj small{font-family:var(--f-body);font-weight:600;font-size:11px;color:var(--ink-3);letter-spacing:.04em;text-transform:uppercase;margin-left:3px}
.oc{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.oc input{width:72px}
.oc .out{font-size:12.5px;font-weight:700;min-width:84px}
.team-sub{display:flex;align-items:center;gap:8px;margin:6px 0 2px}
@media (max-width:620px){
  .prow{grid-template-columns:1fr auto;}
  .prow .c-avg{grid-column:1/-1}
  .prow .c-line{grid-column:1/-1}
}

/* ---------- trends ---------- */
.trend-list{display:flex;flex-direction:column;background:var(--panel);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.tr{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 14px;border-top:1px solid var(--rule)}
.tr:first-child{border-top:0}
.tr .tt{font-weight:650;font-size:14px}
.tr .td{font-size:12.5px;color:var(--ink-2)}
.tr .tc{font-size:12px;color:var(--ink-3)}
.tr .side{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.wk{font-family:var(--f-display);font-weight:900;font-size:15px;letter-spacing:.03em;padding:3px 7px;border-radius:5px;background:var(--ink);color:var(--panel);white-space:nowrap}
.spark{display:block;overflow:visible}
.spark-area{fill:var(--spark-fill)} .spark-line{fill:none;stroke:var(--ink-2);stroke-width:1.7;stroke-linejoin:round;stroke-linecap:round}
.spark-base{stroke:var(--ink-3);stroke-width:1;stroke-dasharray:3 3} .spark-end{fill:var(--ink)}
.up .spark-line{stroke:var(--win)} .up .spark-end{fill:var(--win)} .down .spark-line{stroke:var(--loss)} .down .spark-end{fill:var(--loss)}
.carry{font-size:12px;font-weight:600}
.carry.sticky{color:var(--win)} .carry.noise{color:var(--ink-3)}
.lg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:12px}
.lg{background:var(--panel);border-radius:10px;box-shadow:var(--shadow);padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.lg .v{font-family:var(--f-display);font-weight:900;font-size:26px;line-height:1}
.lg.on{box-shadow:var(--shadow),inset 0 0 0 2px var(--stripe)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.callout{background:var(--panel);border-radius:12px;box-shadow:var(--shadow);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.callout p{margin:0;max-width:75ch}

/* ---------- picks ---------- */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:12px}
.tile{background:var(--panel);border-radius:10px;box-shadow:var(--shadow);padding:12px 14px;min-width:0}
.tile .v{font-family:var(--f-display);font-weight:900;font-size:34px;line-height:1;margin-top:4px}
.tile .v.pos{color:var(--win)} .tile .v.neg{color:var(--loss)}
.tbl-wrap{background:var(--panel);border-radius:12px;box-shadow:var(--shadow);overflow-x:auto}
table.grid{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
table.grid th{text-align:left;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding:10px 12px;border-bottom:1px solid var(--rule);white-space:nowrap}
table.grid td{padding:9px 12px;border-top:1px solid var(--rule);white-space:nowrap}
table.grid tr:first-child td{border-top:0}
table.grid th.r,table.grid td.r{text-align:right}
th.sortable{cursor:pointer;user-select:none}
th.sortable[aria-sort="ascending"]::after{content:" \25B2";font-size:9px} th.sortable[aria-sort="descending"]::after{content:" \25BC";font-size:9px}
.wbar{height:8px;border-radius:2px;background:var(--muted-bg);min-width:80px;position:relative;overflow:hidden}
.wbar span{position:absolute;left:0;top:0;bottom:0;background:var(--ink-2)}
.wbar i{position:absolute;top:-2px;bottom:-2px;left:52.4%;width:2px;background:var(--stripe)}
.pk{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 14px;border-top:1px solid var(--rule)}
.pk:first-child{border-top:0}
.pk .d{font-weight:650}
.pk .m{font-size:12.5px;color:var(--ink-3)}
.pk .acts{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.rp{font-family:var(--f-display);font-weight:900;font-size:15px;width:32px;height:28px;display:inline-flex;align-items:center;justify-content:center;border-radius:6px}
.rp.W{background:var(--win);color:var(--panel)} .rp.L{background:var(--loss);color:var(--panel)} .rp.P,.rp.V{background:var(--push);color:var(--panel)}
.rp.pending{background:var(--muted-bg);color:var(--ink-3);font-size:12px}
.empty{background:var(--panel);border-radius:12px;box-shadow:var(--shadow);padding:22px 18px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.note{font-size:12.5px;color:var(--ink-3)}

/* ---------- sheet (pick form) ---------- */
.scrim{position:fixed;inset:0;background:rgba(5,8,7,.45);z-index:40}
.sheet{position:fixed;z-index:41;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100% - 24px));max-height:calc(100% - 32px);overflow:auto;
  background:var(--panel);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.35);padding:18px;display:flex;flex-direction:column;gap:12px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form .f{display:flex;flex-direction:column;gap:4px;min-width:0}
.form .f.full{grid-column:1/-1}
.form label{font-size:12px;font-weight:700;color:var(--ink-2)}
.form .hint{font-size:12px;color:var(--ink-3)}
.sheet-actions{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);
  padding:9px 14px;border-radius:8px;font-weight:600;font-size:13.5px;z-index:60;box-shadow:var(--shadow)}

/* ---------- what matters ---------- */
.bars{display:flex;flex-direction:column;background:var(--panel);border-radius:12px;box-shadow:var(--shadow);padding:6px 0}
.br{display:grid;grid-template-columns:minmax(0,15em) minmax(0,1fr) 4.5em;gap:12px;align-items:center;padding:7px 14px}
.br .l{font-size:13.5px;min-width:0}
.br .l small{display:block;font-size:11.5px;color:var(--ink-3)}
.br .track{height:14px;background:var(--muted-bg);border-radius:3px;position:relative;overflow:hidden}
.br .track span{position:absolute;left:0;top:0;bottom:0;background:var(--rule-2)}
.br.top .track span{background:var(--stripe)}
.br.top .l{font-weight:700}
.br .val{font-family:var(--f-mono);font-size:12.5px;text-align:right}
.br .rank{font-family:var(--f-display);font-weight:900;font-size:15px;margin-right:6px;color:var(--ink-3)}
.br.top .rank{color:var(--ink)}
.axis{display:grid;grid-template-columns:minmax(0,15em) minmax(0,1fr) 4.5em;gap:12px;padding:2px 14px 8px;font-size:11px;color:var(--ink-3)}
.axis .ticks{display:flex;justify-content:space-between;font-family:var(--f-mono)}
@media (max-width:620px){ .br,.axis{grid-template-columns:minmax(0,9.5em) minmax(0,1fr) 3.6em;gap:8px} }
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px}
.fact{background:var(--panel);border-radius:10px;box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:4px}
.fact .v{font-family:var(--f-display);font-weight:900;font-size:32px;line-height:1}
.fact p{margin:0;font-size:13px;color:var(--ink-2)}
ul.plain{margin:0;padding-left:18px;color:var(--ink-2)}
ul.plain li{margin:3px 0}
.hc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:14px;align-items:start}
.hc{background:var(--panel);border-radius:12px;box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.hc.sel{box-shadow:var(--shadow),inset 0 0 0 2px var(--stripe)}
.hc-top{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center}
.hc-p{display:flex;flex-direction:column;line-height:1;gap:2px}
.hc-p .big{font-family:var(--f-display);font-weight:900;font-size:40px}
.hc-label{font-weight:700;font-size:15.5px;line-height:1.25}
.hc-meter{height:6px;border-radius:3px;background:var(--muted-bg);overflow:hidden}
.hc-meter span{display:block;height:100%;background:var(--win)}
.hc-stats{display:flex;flex-wrap:wrap;gap:6px}
.hc-why{margin:0;font-size:13.5px;color:var(--ink-2)}
.hc-acts{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;border-top:1px solid var(--rule);padding-top:10px}
.hc-acts label{display:inline-flex;gap:6px;align-items:center;font-size:13px;font-weight:600;cursor:pointer}
.parlay-bar{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:15;background:var(--ink);color:var(--panel);border-radius:12px;
  padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;box-shadow:var(--shadow)}
.parlay-bar .big{font-family:var(--f-display);font-weight:900;font-size:24px;line-height:1}
.parlay-bar .btn{box-shadow:none}
.ls .hc-meter span{background:var(--stripe)}
.vchk{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;background:var(--panel-2);border-radius:8px;padding:8px 10px}
.vchk .fair{font-size:12.5px;color:var(--ink-2)}
.vchk .fair b{font-family:var(--f-mono);font-weight:600;color:var(--ink)}
.vchk label{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.vchk input{width:80px;font-family:var(--f-mono);padding:5px 8px}
.vchk .ev{font-size:12.5px;font-weight:700;color:var(--ink-3);flex:1 1 180px}
.vchk .ev.pos{color:var(--win)} .vchk .ev.thin{color:var(--warn)} .vchk .ev.neg{color:var(--loss)}
@media (max-width:620px){ table.grid.tight th, table.grid.tight td{padding:8px 8px} }
.mk-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px 14px;flex-wrap:wrap}
.mk-head .small b{color:var(--ink-2)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="bar">
  <div class="bar-in">
    <div class="brand-row">
      <div class="brand">NFL <b>Edge</b></div>
      <div class="brand-meta"><span id="m-week"></span><span id="m-asof"></span></div>
    </div>
    <nav class="tabs" role="tablist" aria-label="Sections">
      <button class="tab" role="tab" id="tab-week" data-view="week" aria-selected="true">This week</button>
      <button class="tab" role="tab" id="tab-hc" data-view="hc" aria-selected="false">High-chance picks</button>
      <button class="tab" role="tab" id="tab-ls" data-view="ls" aria-selected="false">Long shots</button>
      <button class="tab" role="tab" id="tab-trends" data-view="trends" aria-selected="false">Trends</button>
      <button class="tab" role="tab" id="tab-picks" data-view="picks" aria-selected="false">My picks<span class="cnt" id="pick-count"></span></button>
      <button class="tab" role="tab" id="tab-matters" data-view="matters" aria-selected="false">What matters</button>
      <button class="tab" role="tab" id="tab-teams" data-view="teams" aria-selected="false">Teams</button>
    </nav>
  </div>
</header>

<main>
  <section class="view" id="v-week"></section>
  <section class="view" id="v-hc" hidden></section>
  <section class="view" id="v-ls" hidden></section>
  <section class="view" id="v-trends" hidden></section>
  <section class="view" id="v-picks" hidden></section>
  <section class="view" id="v-matters" hidden></section>
  <section class="view" id="v-teams" hidden></section>
</main>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(async function(){
'use strict';
const DATA_URL = 'data/data.json';
let D;
try {
  const r = await fetch(DATA_URL + '?t=' + Date.now(), {cache: 'no-store'});
  if (!r.ok) throw new Error('HTTP ' + r.status);
  D = await r.json();
} catch(e){
  document.getElementById('v-week').innerHTML = '<div class="empty"><div class="h3">Could not load the latest numbers</div><p class="lede" style="margin:0">Check your connection and reload the page.</p></div>';
  return;
}
let LOADED_AT = Date.now();
const WEEK = D.meta.week;
const $ = (s, el) => (el || document).querySelector(s);
const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {
  get(k, d){ try { const v = localStorage.getItem('nfledge.' + k); return v == null ? d : JSON.parse(v); } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem('nfledge.' + k, JSON.stringify(v)); } catch(e){} }
};
let FAV = new Set(store.get('fav', []));
const T = D.teams;

/* ---------- formatting ---------- */
const sign = (v, d=1) => v == null || isNaN(v) ? '–' : (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v).toFixed(d);
const lineFor = (g, team) => g.spread == null ? null : (team === g.home ? -g.spread : g.spread);
const fmtLine = v => v == null ? '–' : (v === 0 ? 'PK' : sign(v, 1));
const fmtOdds = v => v == null ? '–' : (v > 0 ? '+' + v : '−' + Math.abs(v));
const pct = (x, d=0) => x == null ? '–' : (x * 100).toFixed(d) + '%';
const rec = r => r ? `${r.W}-${r.L}${r.T ? '-' + r.T : ''}` : '–';
const ats = r => r ? `${r.W}-${r.L}${r.P ? '-' + r.P : ''}` : '–';
const ouR = r => r ? `${r.O}-${r.U}${r.P ? '-' + r.P : ''}` : '–';
const chip = (t, sm) => { const x = T[t]; return x ? `<span class="tm${sm ? ' sm' : ''}" style="--c1:${x.c1};--c2:${x.c2}" title="${esc(x.city + ' ' + x.nick)}">${t}</span>` : esc(t); };
const resDots = (arr, n=4) => { const a = arr.slice(-n); let s = '<span class="res" aria-label="' + esc(a.join(' ')) + '">'; for (let i = 0; i < n - a.length; i++) s += '<i class="n"></i>'; a.forEach(r => s += `<i class="${r}"></i>`); return s + '</span>'; };
function kick(iso, opts){
  const d = new Date(iso);
  try { return d.toLocaleString([], Object.assign({weekday:'short', hour:'numeric', minute:'2-digit', timeZoneName:'short'}, opts || {})); }
  catch(e){ return iso; }
}
function rankCls(r){ return r == null ? '' : r <= 8 ? 'good' : r >= 25 ? 'bad' : ''; }
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => t.hidden = true, 2400); }
function spark(series, o){
  o = o || {}; const w = o.w || 104, h = o.h || 30, pad = 3;
  const vals = series.map(s => s[1]); if (!vals.length) return '';
  const all = o.base != null ? vals.concat([o.base]) : vals.slice();
  let lo = Math.min.apply(null, all), hi = Math.max.apply(null, all); if (hi === lo){ hi += 1; lo -= 1; }
  const x = i => pad + i * (w - 2 * pad) / Math.max(1, vals.length - 1);
  const y = v => h - pad - (v - lo) * (h - 2 * pad) / (hi - lo);
  const pts = vals.map((v, i) => x(i).toFixed(1) + ',' + y(v).toFixed(1));
  const area = 'M' + x(0).toFixed(1) + ',' + (h - pad) + ' L' + pts.join(' L') + ' L' + x(vals.length - 1).toFixed(1) + ',' + (h - pad) + ' Z';
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-hidden="true"><path d="${area}" class="spark-area"/>` +
    (o.base != null ? `<line x1="${pad}" x2="${w - pad}" y1="${y(o.base).toFixed(1)}" y2="${y(o.base).toFixed(1)}" class="spark-base"/>` : '') +
    `<polyline points="${pts.join(' ')}" class="spark-line"/><circle cx="${x(vals.length - 1).toFixed(1)}" cy="${y(vals[vals.length - 1]).toFixed(1)}" r="2.8" class="spark-end"/></svg>`;
}
function xLink(name){ return 'https://x.com/search?q=' + encodeURIComponent('"' + name + '" injury') + '&f=live'; }

/* ---------- header ---------- */
$('#m-week').innerHTML = `<strong>Week ${WEEK}</strong> · ${D.meta.season} season`;
function ago(iso){ const m = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 60000)); return m < 1 ? 'just now' : m < 60 ? m + ' min ago' : m < 1440 ? Math.round(m / 60) + ' hr ago' : Math.round(m / 1440) + ' days ago'; }
function renderAsof(){ $('#m-asof').innerHTML = `Updated <strong>${ago(D.meta.asof)}</strong>${D.meta.stats_through ? ` · box scores through ${esc(new Date(D.meta.stats_through + 'T12:00:00').toLocaleDateString([], {weekday: 'short', month: 'short', day: 'numeric'}))}` : ''}`; }
renderAsof(); setInterval(renderAsof, 60000);

/* ---------- tabs ---------- */
function show(view){
  $$('.tab').forEach(b => b.setAttribute('aria-selected', String(b.dataset.view === view)));
  const tb = $(`.tab[data-view="${view}"]`), nav = tb && tb.parentElement;
  if (nav){ const a = tb.getBoundingClientRect(), n = nav.getBoundingClientRect(); if (a.left < n.left || a.right > n.right) nav.scrollLeft += a.left - n.left - 12; }
  $$('.view').forEach(v => v.hidden = v.id !== 'v-' + view);
  store.set('tab', view);
  if (view === 'teams') renderTeams();
  window.scrollTo({top: 0});
}
$$('.tab').forEach(b => b.addEventListener('click', () => show(b.dataset.view)));

/* ======================================================================
   THIS WEEK
   ====================================================================== */
const KEY_ROWS = [
  ['pd_g', 'Point diff / game', v => sign(v, 1)],
  ['off_epa', 'Offense EPA / play', v => sign(v, 2)],
  ['def_epa', 'Defense EPA allowed', v => sign(v, 2)],
  ['off_sr', 'Success rate', v => pct(v)],
  ['off_early', 'Early-down EPA', v => sign(v, 2)],
];
const MORE_ROWS = [
  ['def_sr', 'Success rate allowed', v => pct(v)], ['def_early', 'Early-down EPA allowed', v => sign(v, 2)],
  ['off_pass', 'Pass EPA / dropback', v => sign(v, 2)], ['def_pass', 'Pass EPA allowed', v => sign(v, 2)],
  ['off_rush', 'Rush EPA / carry', v => sign(v, 2)], ['def_rush', 'Rush EPA allowed', v => sign(v, 2)],
  ['sack_off', 'Sack rate allowed', v => pct(v, 1)], ['sack_def', 'Sack rate (defense)', v => pct(v, 1)],
  ['to_g', 'Turnover margin / game', v => sign(v, 1)], ['ppd_off', 'Points per drive', v => (v || 0).toFixed(2)],
  ['ppd_def', 'Points per drive allowed', v => (v || 0).toFixed(2)], ['third_off', '3rd-down %', v => pct(v)],
  ['rz_off', 'Red-zone TD %', v => pct(v)], ['expl_off', 'Explosive play rate', v => pct(v, 1)],
];
function tapeRows(g, rows){
  return rows.map(([k, label, f]) => {
    const a = T[g.away], h = T[g.home];
    const ra = a.ranks[k], rh = h.ranks[k];
    const ba = ra != null && rh != null && ra < rh, bh = ra != null && rh != null && rh < ra;
    return `<tr><td>${label}</td>
      <td class="${ba ? 'better' : ''}"><span class="v">${f(a.stats[k])}</span><span class="rk ${rankCls(ra)}">#${ra ?? '–'}</span></td>
      <td class="${bh ? 'better' : ''}"><span class="v">${f(h.stats[k])}</span><span class="rk ${rankCls(rh)}">#${rh ?? '–'}</span></td></tr>`;
  }).join('');
}
function teamRow(g, side){
  const t = side === 'home' ? g.home : g.away, x = T[t];
  const ln = lineFor(g, t), ml = side === 'home' ? g.ml_home : g.ml_away;
  const scoreHtml = (g.final || g.live) ? (() => { const src = g.final ? g : g.live; const s = side === 'home' ? src.home_score : src.away_score, o = side === 'home' ? src.away_score : src.home_score;
    return `<div class="score ${g.final && s < o ? 'lost' : ''}">${s ?? 0}</div>`; })() :
    `<div class="tline"><div class="sp num">${fmtLine(ln)}</div><div class="ml">ML ${fmtOdds(ml)}</div></div>`;
  return `<div class="trow">
    <div style="display:flex;align-items:center;gap:2px">${chip(t)}<button class="star" data-fav="${t}" aria-pressed="${FAV.has(t)}" aria-label="Star ${esc(x.nick)}">★</button></div>
    <div class="tname"><div class="n">${esc(x.nick)} <span class="rec num">${rec(x.rec)}</span></div>
      <div class="meta"><span>Last 4 ${resDots(x.l4_list)} ${rec(x.l4)}</span><span>ATS ${ats(x.ats)}</span><span>O/U ${ouR(x.ou)}</span>${x.streak ? `<span>${x.streak[0] === 'W' ? 'Won' : x.streak[0] === 'L' ? 'Lost' : 'Tied'} ${x.streak.slice(1)}</span>` : ''}</div></div>
    ${scoreHtml}</div>`;
}
function modelBlock(g){
  const m = g.model, a = g.away, h = g.home;
  const wpA = 1 - m.wp_home, mk = m.mkt_wp_home;
  const fav = m.margin >= 0 ? h : a;
  const qb = [g.qb_change.away, g.qb_change.home].filter(Boolean);
  let pickHtml;
  if (g.final){
    const mp = D.model_picks.filter(p => p.game === g.id);
    pickHtml = mp.map(p => `<span class="pill ${p.result === 'W' ? 'win' : p.result === 'L' ? 'loss' : ''}">${esc(p.type)}: ${esc(p.detail)} · ${p.result === 'W' ? 'Won' : p.result === 'L' ? 'Lost' : 'Push'}</span>`).join(' ');
  } else if (m.pick_ats){
    const ln = lineFor(g, m.pick_ats);
    pickHtml = `<span class="pick-chip"><span class="k">Model pick</span>${m.pick_ats} ${fmtLine(ln)}</span>`;
  } else {
    pickHtml = `<span class="nopick">No spread pick: model within 2.5 pts of the line</span>`;
  }
  const ca = T[a].c1, chh = T[h].c1;
  return `<div class="wp">
      <div class="wp-labels"><span>${a} ${pct(wpA)}</span><span class="small wp-mid">Model win chance${mk != null ? ' · yellow mark = betting market' : ''}</span><span>${pct(m.wp_home)} ${h}</span></div>
      <div class="wp-track" role="img" aria-label="Model gives ${h} ${pct(m.wp_home)} to win${mk != null ? ', market ' + pct(mk) : ''}">
        <span style="width:${(wpA * 100).toFixed(1)}%;background:${ca}"></span><span style="width:${(m.wp_home * 100).toFixed(1)}%;background:${chh}"></span>
        ${mk != null ? `<i class="wp-mkt" style="left:${((1 - mk) * 100).toFixed(1)}%"></i>` : ''}
      </div></div>
    <div class="model-line"><span>Model: <b>${fav} by ${Math.abs(m.margin).toFixed(1)}</b> · Line: <b>${g.spread == null ? '–' : (g.spread >= 0 ? h : a) + ' ' + fmtLine(-Math.abs(g.spread))}</b> · Total <b>${g.total ?? '–'}</b> <span class="small">(stats-only total ${m.total.toFixed(1)})</span></span>${pickHtml}</div>
    ${qb.map(q => `<div class="small">QB change: <b>${esc(q.starter)}</b> ${g.final ? 'started' : 'expected to start'} instead of ${esc(q.usual)}.${q.starter_rating != null ? ` The model adjusts for it, rating ${esc(q.starter.split(' ').slice(-1)[0])} at ${sign(q.starter_rating, 2)} EPA per dropback${q.usual_rating != null ? ` vs ${sign(q.usual_rating, 2)} for ${esc(q.usual.split(' ').slice(-1)[0])}` : ''}.` : ''}</div>`).join('')}`;
}
function gameChips(g){
  const out = [];
  g.mismatches.forEach(mm => out.push(`<span class="pill stripe">${mm.off} ${mm.unit === 'pass' ? 'pass' : 'run'} O #${mm.off_rank} vs ${mm.def} ${mm.unit === 'pass' ? 'pass' : 'run'} D #${mm.def_rank}</span>`));
  const keyInj = [g.away, g.home].map(t => (D.injuries[t] || []).filter(i => i.key && ['out', 'doubt', 'risk', 'gtd'].includes(i.level)).length);
  if (keyInj[0] + keyInj[1]) out.push(`<span class="pill warn">Key injuries: ${g.away} ${keyInj[0]} · ${g.home} ${keyInj[1]}</span>`);
  const tr = D.trends.team.filter(t => (t.team === g.away || t.team === g.home) && t.kind !== 'betting');
  tr.slice(0, 2).forEach(t => out.push(`<span class="pill ${t.tone === 'up' ? 'win' : 'loss'}">${t.team} ${esc(t.label.toLowerCase())}</span>`));
  (g.teaser || []).forEach(x => out.push(`<span class="pill ${x.kind === 'dog' ? 'win' : 'ghost'}" title="Six-point teaser leg">Teaser: ${x.team} ${fmtLine(x.from)} → ${fmtLine(x.to)} · legs like this won ${pct(x.rate)}${x.kind === 'fav' ? ', below break-even' : ''}</span>`));
  if (g.div) out.push('<span class="pill ghost">Division</span>');
  if (g.rest.home && g.rest.away && Math.abs(g.rest.home - g.rest.away) >= 3) out.push(`<span class="pill ghost">Rest: ${g.away} ${g.rest.away}d, ${g.home} ${g.rest.home}d</span>`);
  return out.join('');
}
function gameCard(g){
  const flags = [];
  if (g.final) flags.push('<span class="pill">Final</span>');
  else if (g.live) flags.push(`<span class="pill loss"><span class="dot"></span>Live · ${esc(g.live.detail || '')}</span>`);
  if (g.neutral) flags.push('<span class="pill info">Neutral site</span>');
  if (g.qb_change.away || g.qb_change.home) flags.push('<span class="pill warn">QB change</span>');
  return `<article class="game" id="g-${g.id}" data-id="${g.id}">
    <div class="g-head"><div><div class="g-when">${esc(kick(g.kickoff))}</div><div class="g-where">${esc(g.stadium || '')}</div></div><div class="g-flags">${flags.join('')}</div></div>
    <div class="g-body">
      <div>${teamRow(g, 'away')}${teamRow(g, 'home')}</div>
      ${modelBlock(g)}
      <table class="tape"><thead><tr><th>Season stats (rank of 32)</th><th>${g.away}</th><th>${g.home}</th></tr></thead><tbody>${tapeRows(g, KEY_ROWS)}</tbody></table>
      <div class="g-chips">${gameChips(g)}</div>
    </div>
    <button class="g-more" data-more="${g.id}" aria-expanded="false" aria-controls="d-${g.id}"><span>Injuries, player props, trends and results</span><span aria-hidden="true">＋</span></button>
    <div class="g-detail" id="d-${g.id}" hidden></div>
  </article>`;
}
const DETAIL_TABS = [['inj', 'Injuries'], ['props', 'Player props'], ['trends', 'Trends'], ['stats', 'All stats'], ['log', 'Results']];
function detailHtml(g, which){
  which = which || (g.final ? 'log' : 'inj');
  const seg = `<div class="seg" role="group" aria-label="Game details">${DETAIL_TABS.map(([k, l]) => `<button data-dtab="${k}" data-g="${g.id}" aria-pressed="${k === which}">${l}</button>`).join('')}</div>`;
  let body = '';
  if (which === 'inj') body = `<div class="twocol">${[g.away, g.home].map(t => injCol(t)).join('')}</div>

/* ---------- props ---------- */
const PROP_LABEL = {pass_yds: 'Pass yds', rush_yds: 'Rush yds', rec_yds: 'Rec yds', receptions: 'Receptions', any_td: 'Anytime TD'};
function mainProps(p){ return p.pos === 'QB' ? ['pass_yds'] : p.pos === 'RB' ? ['rush_yds', 'receptions'] : ['rec_yds', 'receptions']; }
function survChance(key, proj, t){
  const dist = (D.prop_dist || {})[key]; if (!dist) return null;
  const grid = dist.grid, bins = dist.bins, cs = bins.map(b => b.center);
  const surv = b => { if (t <= grid[0]) return b.surv[0]; if (t >= grid[grid.length - 1]) return b.surv[b.surv.length - 1];
    let j = 0; while (grid[j + 1] < t) j++; const w = (t - grid[j]) / (grid[j + 1] - grid[j]); return b.surv[j] * (1 - w) + b.surv[j + 1] * w; };
  if (proj <= cs[0]) return surv(bins[0]); if (proj >= cs[cs.length - 1]) return surv(bins[bins.length - 1]);
  let k = 0; while (cs[k + 1] < proj) k++; const w = (proj - cs[k]) / (cs[k + 1] - cs[k]);
  return surv(bins[k]) * (1 - w) + surv(bins[k + 1]) * w;
}
function overChance(key, proj, line){
  if (proj != null && line !== '' && !isNaN(line) && D.prop_dist && D.prop_dist[key]) return survChance(key, proj, Math.floor(Number(line)) + 1);
  const bins = D.prop_bins[key]; if (!bins || proj == null || line === '' || isNaN(line)) return null;
  line = Number(line);
  let b = bins.find(b => proj >= b.lo && proj <= b.hi) || (proj < bins[0].lo ? bins[0] : bins[bins.length - 1]);
  const q = b.q.map(v => Math.max(0, v + (proj - b.center)));
  const ps = q.map((_, i) => 0.05 + i * 0.05);
  if (line < q[0]) return 0.96; if (line > q[q.length - 1]) return 0.04;
  for (let i = 0; i < q.length - 1; i++){
    if (line >= q[i] && line <= q[i + 1]){ const t = (line - q[i]) / ((q[i + 1] - q[i]) || 1); return 1 - (ps[i] + t * (ps[i + 1] - ps[i])); }

}

function parseOdds(v){
  const t = String(v == null ? '' : v).trim().replace(/[\u2212\u2013]/g, '-').replace(/^\+/, '');
  if (!t) return null; const o = Number(t); return isFinite(o) && Math.abs(o) >= 100 ? o : null;

  if (ev >= 0.05) return {t: `Good price: about +${c}\u00a2 back per $1 over time`, c: 'pos'};
  if (ev >= 0) return {t: `Thin edge: +${c}\u00a2 per $1, inside the model's margin of error`, c: 'thin'};

const PT = {

  pass_yds: {label: 'Passing yards', cat: 'Player', idx: 2}, pass_td: {label: 'Passing TDs', cat: 'Player', idx: 3}, completions: {label: 'Completions', cat: 'Player', idx: 0},
  pass_att: {label: 'Pass attempts', cat: 'Player', idx: 1}, ints: {label: 'Interceptions', cat: 'Player', idx: 4}, rush_yds: {label: 'Rushing yards', cat: 'Player', idx: 6},
  carries: {label: 'Rush attempts', cat: 'Player', idx: 5}, rec_yds: {label: 'Receiving yards', cat: 'Player', idx: 10}, receptions: {label: 'Receptions', cat: 'Player', idx: 8},
  rush_rec: {label: 'Rush + rec yards', cat: 'Player', f: w => w[6] + w[10]}, any_td: {label: 'Anytime TD', cat: 'Player', f: w => w[7] + w[11]},
  first_td: {label: 'First TD scorer', cat: 'Player'}, td2: {label: '2+ TDs', cat: 'Player', f: w => w[7] + w[11]},
  parlay: {label: 'Parlay', cat: 'Other'}, teaser: {label: 'Teaser', cat: 'Other'}, other: {label: 'Other', cat: 'Other'}
};
const NO_LINE = ['any_td', 'first_td', 'td2'];
let PICKS = [], PICK_MODE = 'loading', DB = null, UID = null;
function boxIn(g){ return Object.values(D.grade.players).some(x => (x.t === g.h || x.t === g.a) && x.w[g.wk]); }
function profit(p, r){ const u = Number(p.units) || 1, o = Number(p.odds) || -110; return r === 'W' ? u * (o > 0 ? o / 100 : 100 / Math.abs(o)) : r === 'L' ? -u : 0; }
function gradePick(p){
  if (p.manual) return {r: p.manual};
  const g = D.grade.games[p.game];
  if (!g || g.hs == null) return {r: null};
  const margin = p.team === g.h ? g.hs - g.as : g.as - g.hs;
  const ou = (val) => { const d = val - Number(p.line); return {r: d === 0 ? 'P' : ((d > 0) === (p.side === 'O') ? 'W' : 'L'), actual: val}; };
  if (p.type === 'spread'){ const v = margin + Number(p.line); return {r: v > 0 ? 'W' : v < 0 ? 'L' : 'P', actual: margin}; }
  if (p.type === 'ml') return {r: margin > 0 ? 'W' : margin < 0 ? 'L' : 'P', actual: margin};
  if (p.type === 'total') return ou(g.hs + g.as);
  if (p.type === 'team_total') return ou(p.team === g.h ? g.hs : g.as);
  const def = PT[p.type]; if (!def || def.cat !== 'Player') return {r: null};
  const pl = D.grade.players[p.player]; const w = pl && pl.w[g.wk];
  if (!w) return {r: boxIn(g) ? 'V' : null};
  if (p.type === 'first_td') return g.ftd == null ? {r: null} : {r: g.ftd === p.player ? 'W' : 'L', actual: g.ftd ? 'first TD by ' + (g.ftdn || 'another player') : 'no touchdown'};
  const val = def.f ? def.f(w) : w[def.idx];
  if (p.type === 'any_td') return {r: val > 0 ? 'W' : 'L', actual: val};
  if (p.type === 'td2') return {r: val >= 2 ? 'W' : 'L', actual: val};
  return ou(val);
}
function impProb(o){ o = Number(o); return o < 0 ? -o / (-o + 100) : 100 / (o + 100); }
function clvOf(p){
  const g = D.grade.games[p.game]; if (!g) return null;
  const started = g.hs != null || (g.k && Date.now() > new Date(g.k).getTime());
  let out = null;
  if (p.type === 'spread' && g.sp != null && p.line != null){ const close = p.team === g.h ? -g.sp : g.sp; out = {v: Number(p.line) - close, txt: fmtLine(close), unit: 'pts'}; }
  else if (p.type === 'total' && g.tl != null && p.line != null){ out = {v: p.side === 'O' ? g.tl - Number(p.line) : Number(p.line) - g.tl, txt: String(g.tl), unit: 'pts'}; }
  else if (p.type === 'ml'){ const cl = p.team === g.h ? g.mlh : g.mla; if (cl != null) out = {v: (impProb(cl) - impProb(p.odds)) * 100, txt: fmtOdds(cl), unit: '%'}; }
  if (out) out.closed = started;
  return out;
}
function describePick(p){
  const g = D.grade.games[p.game] || {};
  const def = PT[p.type] || {label: p.type};
  const gm = g.a ? `${g.a} @ ${g.h}` : '';
  if (p.type === 'spread') return `${p.team} ${fmtLine(Number(p.line))}`;
  if (p.type === 'ml') return `${p.team} moneyline`;
  if (p.type === 'total') return `${p.side === 'O' ? 'Over' : 'Under'} ${p.line} (${gm})`;
  if (p.type === 'team_total') return `${p.team} team total ${p.side === 'O' ? 'over' : 'under'} ${p.line}`;
  if (def.cat === 'Player'){
    const nm = p.player_name || (D.grade.players[p.player] || {}).n || 'Player';
    if (NO_LINE.includes(p.type)) return `${nm} ${({any_td: 'anytime TD', first_td: 'first TD', td2: '2+ TDs'})[p.type]}`;
    return `${nm} ${p.side === 'O' ? 'over' : 'under'} ${p.line} ${def.label.toLowerCase()}`;
  }
  return p.note || def.label;
}
function summarize(list){
  const s = {W: 0, L: 0, P: 0, pend: 0, units: 0, risk: 0};
  list.forEach(p => { const r = p._r; if (r === 'W' || r === 'L' || r === 'P' || r === 'V'){ s[r === 'V' ? 'P' : r]++; s.units += profit(p, r); s.risk += (Number(p.units) || 1); } else s.pend++; });
  s.pct = s.W + s.L ? s.W / (s.W + s.L) : null; s.roi = s.risk ? s.units / s.risk : null;
  return s;
}
let PF = Object.assign({status: 'all', type: 'all'}, store.get('pf', {}));

  const byType = {};
  PICKS.forEach(p => { (byType[p.type] = byType[p.type] || []).push(p); });
  const typeRows = Object.keys(byType).sort((a, b) => byType[b].length - byType[a].length).map(k => {
    const x = summarize(byType[k]);

function gamesForWeek(w){ return Object.entries(D.grade.games).filter(([id, g]) => g.wk === w).sort((a, b) => a[1].k.localeCompare(b[1].k)); }
function playersFor(gid){
  const g = D.grade.games[gid]; if (!g) return [];
  const live = (D.games.find(x => x.id === gid) || {props: []}).props.map(p => ({id: p.id, n: p.name, p: p.pos, t: p.team}));
  const fromLog = Object.entries(D.grade.players).filter(([id, x]) => x.t === g.a || x.t === g.h).map(([id, x]) => ({id, n: x.n, p: x.p, t: x.t}));
  const seen = new Set(); const all = [];
  live.concat(fromLog).forEach(p => { if (!seen.has(p.id)){ seen.add(p.id); all.push(p); } });
  const order = {QB: 0, RB: 1, WR: 2, TE: 3, FB: 4};
  return all.sort((a, b) => (a.t === b.t ? 0 : a.t === g.a ? -1 : 1) || (order[a.p] ?? 9) - (order[b.p] ?? 9) || a.n.localeCompare(b.n));
}

async function savePick(){

      <p class="lede">Tested on ${R.n_games.toLocaleString()} regular-season games from 2018–2025: for each stat, how well a team's numbers <i>before</i> kickoff predicted the final margin. Higher bars predict better. The top 8 are highlighted.</p></div></div>
    <div class="facts">
      <div class="fact"><div class="label">Best single stat</div><div class="v">Point diff</div><p>Season point differential (r = ${team[0].r_predict.toFixed(3)}), with EPA per play right behind it (${team[1].r_predict.toFixed(3)}). The betting line itself is better than any single stat (r = ${R.market_r.toFixed(2)}).</p></div>
      <div class="fact"><div class="label">Most overrated</div><div class="v">Turnovers</div><p>Turnover margin explains a lot of results after the fact (r = ${(team.find(r => r.key === 'to') || {}).r_describe?.toFixed(2)}) but barely predicts the next game (${(team.find(r => r.key === 'to') || {}).r_predict?.toFixed(2)}). Time of possession and red-zone TD % behave the same way.</p></div>
      <div class="fact"><div class="label">Last 4 vs full season</div><div class="v">Full season</div><p>Full-season point differential predicted the next game better (r = .41) than the last 4 games alone (r = .34). Recent form is context; the full sample is the signal.</p></div>
    </div>
    <div class="sec-head"><h2 class="h3">Team stats ranked by predictive power</h2><span class="small">Bar = correlation of the pre-game stat gap with the final margin</span></div>
    <div class="bars">${teamBars}<div class="axis"><span></span><span class="ticks"><span>0</span><span>.15</span><span>.30</span><span>.45</span></span><span></span></div></div>

    <div class="sec-head"><div><h2 class="h3">Player stats ranked for props</h2><p class="lede">Season-to-date numbers vs. the next game's result for 2018–2025. Volume and share beat efficiency, and the matchup ("yards allowed to the position") barely registers.</p></div>
      <div class="seg" role="group" aria-label="Prop type">${propTabs.map(([k, l]) => `<button data-prop="${k}" aria-pressed="${k === PROP_SEL}">${l}</button>`).join('')}</div></div>
    <div class="bars">${pBars}<div class="axis"><span></span><span class="ticks"><span>0</span><span>.25</span><span>.55</span></span><span></span></div></div>
    <div class="note">Projection model for this prop uses the top non-tracking stats. Out of sample (2024–25, ${P.n_test.toLocaleString()} player-games): r = ${P.r_model.toFixed(2)} vs ${P.r_season_avg.toFixed(2)} for the plain season average; average miss ${P.mae_model} vs ${P.mae_season_avg}.</div>

    <div class="sec-head"><div><h2 class="h3">How good is the model?</h2><p class="lede">The model uses the top team stats plus each starting quarterback's rating and rest and travel. Tested on 2020–2025, with each season predicted only from the seasons before it.</p></div></div>
    <div class="facts">
      <div class="fact"><div class="label">Picking winners</div><div class="v">${pct(R.model_v2.walk_forward.su, 1)}</div><p>Taking the Vegas favorite every time picked ${pct(R.model_v2.favorites_su, 1)} over the same games. This season: ${w.filter(p => p.result === 'W').length}-${w.filter(p => p.result === 'L').length}.</p></div>
      <div class="fact"><div class="label">Against the spread</div><div class="v">${pct(R.model_v2.walk_forward['0'].pct, 1)}</div><p>Over ${(R.model_v2.walk_forward['0'].w + R.model_v2.walk_forward['0'].l).toLocaleString()} games. You need 52.4% to profit at −110, and luck alone moves a sample this size about 2.5 points. This season: ${sp.filter(p => p.result === 'W').length}-${sp.filter(p => p.result === 'L').length}.</p></div>
      <div class="fact"><div class="label">Moneyline value bets</div><div class="v">${pct(ml[1].test.roi, 1)}</div><p>Return from an earlier version when betting sides it rated 5+ points of win probability better than the market (${ml[1].test.bets} bets).</p></div>
      <div class="fact"><div class="label">Totals</div><div class="v">${pct(ou0.test_w / (ou0.test_w + ou0.test_l), 1)}</div><p>Over/under accuracy from team stats alone, so the model shows a stats-only total for context and makes no total picks.</p></div>
    </div>

    ${spreadTests(R.spread)}
    <div class="sec-head"><div><h2 class="h3">Do 2+ week trends continue?</h2><p class="lede">How often each kind of trend carried into the next game, 2018–2025.</p></div></div>
    <div class="tbl-wrap"><table class="grid"><thead><tr><th>Trend</th><th>Next game</th><th class="r">Rate</th><th class="r">Normal</th><th class="r">Diff (pts)</th><th class="r">Times</th></tr></thead><tbody>${carryRows}</tbody></table></div>

    <div class="callout"><div class="h3">Sources and method</div>
      <ul class="plain">${D.meta.sources.map(s => `<li>${esc(s)}</li>`).join('')}</ul>
      <p class="small">Team ratings blend last season (pulled toward average by how stable each stat is year to year) with this season's games. EPA (expected points added) and success rate come from nflverse play-by-play. Data refreshes automatically about every 30 minutes; this copy was built ${esc(kick(D.meta.asof, {weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit'}))}.</p></div>`;
}

function spreadTests(S){
  if (!S || !S.variants) return '';
  const order = ['Current model', 'Opponent-adjusted efficiency', 'Garbage time removed', 'Recent games weighted more', 'Starting QB rating added', 'Rest, travel and situation added', 'Pressure rates added', 'All of the above'];
  const label = {'Current model': 'Stats only (first version)', 'Opponent-adjusted efficiency': 'Adjusted for opponent strength', 'Garbage time removed': 'Garbage time removed',
    'Recent games weighted more': 'Recent games weighted more', 'Starting QB rating added': 'Starting-QB rating added', 'Rest, travel and situation added': 'Rest, travel and situation added',
    'Pressure rates added': 'Pass-rush and pass-block pressure added', 'All of the above': 'All combined'};
  const rows = order.filter(k => S.variants[k]).map(k => { const v = S.variants[k];
    return `<tr><td style="white-space:normal">${label[k]}</td><td class="r num">${pct(v.su, 1)}</td><td class="r num">${pct(v['0'].pct, 1)}</td><td class="r num">${pct(v['3.0'].pct, 1)}</td></tr>`; }).join('');
  const T_ = S.teaser, K = S.key, sp = S.splits || {};
  return `<div class="sec-head"><div><h2 class="h3">Can it beat the spread?</h2><p class="lede">Each fix tested on ${(S.variants['Current model']['0'].w + S.variants['Current model']['0'].l).toLocaleString()} games from 2020–2025, predicting each season only from earlier ones. Fixes that help pick winners don't help against the spread, because the betting line already prices them in.</p></div></div>
    <div class="tbl-wrap"><table class="grid"><thead><tr><th>Version</th><th class="r">Picks winners</th><th class="r">Covers, all games</th><th class="r">Covers, 3+ pt edge</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="facts">
      <div class="fact"><div class="label">Half a point at 3</div><div class="v">${pct(K.p_fav_by_3_when_line_near_3)}</div><p>Games lined near 3 that the favorite won by exactly 3. Getting +3.5 instead of +3 turns those pushes into wins, so shopping for the better number beats any model tweak.</p></div>
      <div class="fact"><div class="label">Teaser legs: underdogs</div><div class="v">${pct(T_.dog_leg, 1)}</div><p>Six-point teasers taking +1.5 to +2.5 underdogs up through 3 and 7 won ${pct(T_.dog_leg, 1)} of legs (${T_.dog_n} games, 2018–25; ${pct(T_.dog_leg_lowtotal, 1)} when the total was 49 or less). A two-team teaser at −120 needs ${pct(T_.breakeven_2team_minus120, 1)} per leg.</p></div>
      <div class="fact"><div class="label">Teaser legs: favorites</div><div class="v">${pct(T_.fav_leg, 1)}</div><p>Teasing −7.5 to −8.5 favorites down to −1.5 or −2.5 won ${pct(T_.fav_leg, 1)} of legs (${T_.fav_n} games), below break-even.</p></div>
      <div class="fact"><div class="label">Worth watching</div><div class="v">${pct((sp['Road underdogs'] || {}).rate, 1)}</div><p>Road underdogs' cover rate, 2018–25 (${((sp['Road underdogs'] || {}).n || 0).toLocaleString()} games). Division underdogs: ${pct((sp['Division underdogs'] || {}).rate, 1)}. Close to break-even, so not proven.</p></div>
    </div>`;
}

/* ======================================================================
   TEAMS
   ====================================================================== */
let TS = store.get('ts', {k: 'power', dir: 'desc'});
function renderTeams(){
  const v = $('#v-teams');
  const cols = [
    ['team', 'Team', t => t.nick, false], ['rec', 'Record', t => t.rec.W - t.rec.L + t.rec.T * 0, true], ['l4', 'Last 4', t => t.l4.W - t.l4.L, true],
    ['ats', 'ATS', t => t.ats.W - t.ats.L, true], ['ou', 'O/U', t => t.ou.O - t.ou.U, true], ['pd', 'Diff / g', t => t.gp ? (t.pf - t.pa) / t.gp : 0, true],
    ['power', 'Power', t => t.power, true], ['off', 'Off EPA', t => -(t.ranks.off_epa || 99), true], ['def', 'Def EPA', t => -(t.ranks.def_epa || 99), true],
    ['sr', 'Success', t => -(t.ranks.off_sr || 99), true], ['early', 'Early-down', t => -(t.ranks.off_early || 99), true]];
  const col = cols.find(c => c[0] === TS.k) || cols[6];
  const list = Object.values(T).slice().sort((a, b) => { const x = col[2](a), y = col[2](b); const c = typeof x === 'string' ? x.localeCompare(y) : x - y; return TS.dir === 'asc' ? c : -c; });
  const rk = r => `<span class="rk ${rankCls(r)}">#${r ?? '–'}</span>`;
  v.innerHTML = `
    <div class="sec-head"><div><h1 class="h2">Teams</h1><p class="lede">Power = model's expected margin against an average team on a neutral field. Ranks are out of 32. Star teams to pin them on This week.</p></div></div>
    <div class="tbl-wrap"><table class="grid"><thead><tr><th></th>${cols.map(c => `<th class="sortable ${c[3] ? 'r' : ''}" data-sort="${c[0]}" aria-sort="${TS.k === c[0] ? (TS.dir === 'asc' ? 'ascending' : 'descending') : 'none'}" tabindex="0">${c[1]}</th>`).join('')}</tr></thead>
    <tbody>${list.map(t => `<tr><td><button class="star" data-fav="${t.abbr}" aria-pressed="${FAV.has(t.abbr)}" aria-label="Star ${esc(t.nick)}">★</button></td>
      <td><span style="display:inline-flex;gap:8px;align-items:center">${chip(t.abbr, 1)} ${esc(t.nick)}</span></td>
      <td class="r">${rec(t.rec)}</td><td class="r">${resDots(t.l4_list)}</td><td class="r">${ats(t.ats)}</td><td class="r">${ouR(t.ou)}</td>
      <td class="r">${sign(t.gp ? (t.pf - t.pa) / t.gp : 0, 1)}</td><td class="r"><b>${sign(t.power, 1)}</b></td>
      <td class="r">${rk(t.ranks.off_epa)}</td><td class="r">${rk(t.ranks.def_epa)}</td><td class="r">${rk(t.ranks.off_sr)}</td><td class="r">${rk(t.ranks.off_early)}</td></tr>`).join('')}</tbody></table></div>`;
}

/* ======================================================================
   EVENTS
   ====================================================================== */
document.addEventListener('click', async e => {
  const t = e.target.closest('button, a'); if (!t) return;
  if (t.dataset.wf){ weekFilter = t.dataset.wf; store.set('wf', weekFilter); renderWeek(); return; }
  if (t.dataset.fav){ const k = t.dataset.fav; FAV.has(k) ? FAV.delete(k) : FAV.add(k); store.set('fav', [...FAV]); $$(`[data-fav="${k}"]`).forEach(b => b.setAttribute('aria-pressed', String(FAV.has(k)))); if (!$('#v-week').hidden) renderWeek(); return; }
  if (t.dataset.more){
    const id = t.dataset.more, det = $('#d-' + id), open = det.hidden;
    det.hidden = !open; t.setAttribute('aria-expanded', String(open)); t.lastElementChild.textContent = open ? '－' : '＋';
    if (open) det.innerHTML = detailHtml(D.games.find(g => g.id === id));
    return;
  }
  if (t.dataset.dtab){ const g = D.games.find(x => x.id === t.dataset.g); $('#d-' + g.id).innerHTML = detailHtml(g, t.dataset.dtab); return; }
  if (t.dataset.injall){ const k = t.dataset.injall; injShowAll[k] = !injShowAll[k]; const det = t.closest('.g-detail'); const g = D.games.find(x => x.id === det.id.slice(2)); det.innerHTML = detailHtml(g, 'inj'); return; }
  if (t.dataset.jump){ weekFilter = 'all'; renderWeek(); const el = $('#g-' + t.dataset.jump); if (el){ el.scrollIntoView({block: 'start'}); const b = $('[data-more]', el); if (b && b.getAttribute('aria-expanded') === 'false') b.click(); } return; }
  if (t.hasAttribute('data-addpick')){ openPick(); return; }
  if (t.dataset.pickprop){
    const g = D.games.find(x => x.id === t.dataset.g), key = t.dataset.key;
    const inp = $(`#ln_${CSS.escape(t.dataset.pickprop)}_${key}`);
    openPick({week: g.week, game: g.id, type: key, player: t.dataset.pickprop, side: 'O', line: inp && inp.value !== '' ? Number(inp.value) : ''});
    return;
  }
  if (t.dataset.delpick){
    if (t.dataset.confirm === '1'){ try { await deletePick(t.dataset.delpick); toast('Pick deleted'); } catch(err){ toast('Could not delete. Try again.'); } }
    else { t.dataset.confirm = '1'; t.textContent = 'Tap again to delete'; setTimeout(() => { if (t.isConnected){ t.dataset.confirm = ''; t.textContent = 'Delete'; } }, 3000); }
    return;
  }
  if (t.dataset.setres){ try { await setResult(t.dataset.setres, t.dataset.res); } catch(err){ toast('Could not update. Try again.'); } return; }
  if (t.dataset.prop){ PROP_SEL = t.dataset.prop; renderMatters(); return; }
  if (t.dataset.lsf){ LS_F = t.dataset.lsf; store.set('lsf', LS_F); renderLS(); return; }
  if (t.dataset.lspick){
    const x = D.long_shots.picks[Number(t.dataset.lspick)];
    openPick({week: x.week, game: x.game, type: x.type, player: x.id, side: 'O', line: x.line == null ? '' : x.line, odds: oddsFor(lsKey(x), x.fair)});
    return;
  }
  if (t.hasAttribute('data-lsclear')){ LS_SEL.clear(); renderLS(); return; }
  if (t.hasAttribute('data-lsparlay')){
    const legs = [...LS_SEL].map(i => D.long_shots.picks[i]); const P = legs.reduce((a, x) => a * x.p, 1);
    openPick({week: WEEK, game: legs[0].game, type: 'parlay', note: legs.map(x => x.label).join(' + '), odds: oddsNum(P)});
    return;
  }
  if (t.dataset.hcpick){
    const x = D.high_chance.picks[Number(t.dataset.hcpick)];
    if (x.kind === 'player') openPick({week: x.week, game: x.game, type: x.key, player: x.id, side: 'O', line: x.t - 0.5, odds: oddsFor(hcKey(x), x.fair)});
    else if (x.kind === 'ml') openPick({week: x.week, game: x.game, type: 'ml', team: x.team, odds: oddsFor(hcKey(x), x.odds)});
    else openPick({week: x.week, game: x.game, type: 'teaser', note: x.label, odds: -120});
    return;
  }
  if (t.hasAttribute('data-hcclear')){ HC_SEL.clear(); renderHC(); return; }
  if (t.hasAttribute('data-hcparlay')){
    const legs = [...HC_SEL].map(i => D.high_chance.picks[i]);
    const P = legs.reduce((a, x) => a * x.p, 1);
    openPick({week: WEEK, game: legs[0].game, type: legs.every(x => x.kind === 'teaser') ? 'teaser' : 'parlay', note: legs.map(x => x.label).join(' + '), odds: oddsNum(P)});
    return;
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('#sheet').hidden) closePick();
  const th = e.target.closest && e.target.closest('th[data-sort]');
  if (th && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); th.click(); }
});
$('#scrim').addEventListener('click', closePick);
document.addEventListener('click', e => {
  const th = e.target.closest('th[data-sort]'); if (!th) return;
  const k = th.dataset.sort; TS = {k, dir: TS.k === k && TS.dir === 'desc' ? 'asc' : 'desc'}; store.set('ts', TS); renderTeams();
});
document.addEventListener('change', e => {
  const el = e.target; if (!el.dataset) return;
  if (el.dataset.hcsel != null){ const i = Number(el.dataset.hcsel); el.checked ? HC_SEL.add(i) : HC_SEL.delete(i); const y = window.scrollY; renderHC(); window.scrollTo({top: y}); }
  if (el.dataset.lssel != null){ const i = Number(el.dataset.lssel); el.checked ? LS_SEL.add(i) : LS_SEL.delete(i); const y = window.scrollY; renderLS(); window.scrollTo({top: y}); }
});
document.addEventListener('input', e => {
  const el = e.target; if (!el.dataset) return;
  if (el.dataset.odds != null){
    const k = el.dataset.odds; if (el.value.trim()) MY_ODDS[k] = el.value.trim(); else delete MY_ODDS[k]; store.set('odds', MY_ODDS);
    const m = evMsg(Number(el.dataset.p), Number(el.dataset.fair), el.value);
    $$(`[data-ev="${CSS.escape(k)}"]`).forEach(o => { o.textContent = m.t; o.className = 'ev ' + m.c; });
    return;
  }
  if (!el.dataset.oc) return;
  const out = $('#' + el.id.replace(/^ln_/, 'oc_'));
  const p = overChance(el.dataset.oc, Number(el.dataset.proj), el.value);
  out.textContent = p == null ? 'Enter a line' : `Over ${pct(p)} · Under ${pct(1 - p)}`;
  out.style.color = p == null ? '' : p >= 0.56 ? 'var(--win)' : p <= 0.44 ? 'var(--loss)' : '';
});

/* ---------- live scores (ESPN) and fresh data ---------- */
const NAME2AB = {}; Object.values(T).forEach(t => { NAME2AB[t.city + ' ' + t.nick] = t.abbr; });
let liveTimer = null;
async function liveScores(){
  try {
    const ctl = new AbortController(); const tm = setTimeout(() => ctl.abort(), 7000);
    const r = await fetch('https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard', {signal: ctl.signal, cache: 'no-store'});
    clearTimeout(tm); if (!r.ok) return;
    const j = await r.json(); let changed = false, anyLive = false;
    (j.events || []).forEach(ev => {
      const comp = (ev.competitions || [])[0]; if (!comp) return;
      const cs = comp.competitors || []; const h = cs.find(c => c.homeAway === 'home'), a = cs.find(c => c.homeAway === 'away'); if (!h || !a) return;
      const ha = NAME2AB[(h.team || {}).displayName], aa = NAME2AB[(a.team || {}).displayName]; if (!ha || !aa) return;
      const st = ((comp.status || ev.status || {}).type) || {}; const hs = parseInt(h.score, 10), as = parseInt(a.score, 10);
      const g = D.games.find(x => x.home === ha && x.away === aa);
      if (g && st.state === 'in'){ g.live = {detail: st.shortDetail || st.detail || 'In progress', home_score: hs, away_score: as}; anyLive = true; changed = true; }
      if (st.state === 'post' && st.completed && !isNaN(hs)){
        if (g && !g.final){ g.final = true; g.live = null; g.home_score = hs; g.away_score = as; changed = true; }
        const gg = Object.values(D.grade.games).find(x => x.h === ha && x.a === aa && x.hs == null && (!g || x.wk === g.week));
        if (gg){ gg.hs = hs; gg.as = as; changed = true; }
      }
    });
    if (changed){ if (!$('#v-week').hidden && !$$('.g-detail').some(d => !d.hidden)) renderWeek(); renderPicks(); }
    clearTimeout(liveTimer);
    if (anyLive) liveTimer = setTimeout(() => { if (!document.hidden) liveScores(); }, 60000);
  } catch(e){ /* live scores are a bonus; the published data still loads */ }
}
async function checkForNewData(){
  if (Date.now() - LOADED_AT < 10 * 60000) return;
  try {
    const r = await fetch(DATA_URL + '?t=' + Date.now(), {cache: 'no-store'}); if (!r.ok) return;
    const j = await r.json(); LOADED_AT = Date.now();
    if (j.meta.asof !== D.meta.asof && !$('#fresh')){
      const b = document.createElement('div'); b.id = 'fresh'; b.className = 'toast'; b.setAttribute('role', 'status');
      b.innerHTML = 'Newer numbers are available. <button class="btn tiny stripe" style="margin-left:8px" id="fresh-go">Reload</button>';
      document.body.appendChild(b); $('#fresh-go').addEventListener('click', () => location.reload());
    }
  } catch(e){}
}
document.addEventListener('visibilitychange', () => { if (!document.hidden){ checkForNewData(); liveScores(); } });

/* ---------- boot ---------- */
renderWeek(); renderHC(); renderLS(); renderTrends(); renderPicks(); renderMatters();
const startTab = location.hash.replace('#', '') || store.get('tab', 'week');
if (['week', 'hc', 'ls', 'trends', 'picks', 'matters', 'teams'].includes(startTab) && startTab !== 'week') show(startTab);
initPicks();
liveScores();
})();
