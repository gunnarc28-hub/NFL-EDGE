<script>
(async function(){
'use strict';
const DATA_URL = 'data/data.json';
let D;
try {
  const r = await fetch(DATA_URL + '?t=' + Date.now(), {cache: 'no-store'});
  if (!r.ok) throw new Error('HTTP ' + r.status);
  D = await r.json();
} catch(e){
  document.getElementById('v-week').innerHTML = '<div class="empty"><div class="h3">Could not load the latest numbers</div><p class="lede" style="margin:0">Check your connection and reload the page.</p></div>';
  return;
}
let LOADED_AT = Date.now();
const WEEK = D.meta.week;
const $ = (s, el) => (el || document).querySelector(s);
const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {
  get(k, d){ try { const v = localStorage.getItem('nfledge.' + k); return v == null ? d : JSON.parse(v); } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem('nfledge.' + k, JSON.stringify(v)); } catch(e){} }
};
let FAV = new Set(store.get('fav', []));
const T = D.teams;

/* ---------- formatting ---------- */
const sign = (v, d=1) => v == null || isNaN(v) ? '–' : (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v).toFixed(d);
const lineFor = (g, team) => g.spread == null ? null : (team === g.home ? -g.spread : g.spread);
const fmtLine = v => v == null ? '–' : (v === 0 ? 'PK' : sign(v, 1));
const fmtOdds = v => v == null ? '–' : (v > 0 ? '+' + v : '−' + Math.abs(v));
const pct = (x, d=0) => x == null ? '–' : (x * 100).toFixed(d) + '%';
const rec = r => r ? `${r.W}-${r.L}${r.T ? '-' + r.T : ''}` : '–';
const ats = r => r ? `${r.W}-${r.L}${r.P ? '-' + r.P : ''}` : '–';
const ouR = r => r ? `${r.O}-${r.U}${r.P ? '-' + r.P : ''}` : '–';
const chip = (t, sm) => { const x = T[t]; return x ? `<span class="tm${sm ? ' sm' : ''}" style="--c1:${x.c1};--c2:${x.c2}" title="${esc(x.city + ' ' + x.nick)}">${t}</span>` : esc(t); };
const resDots = (arr, n=4) => { const a = arr.slice(-n); let s = '<span class="res" aria-label="' + esc(a.join(' ')) + '">'; for (let i = 0; i < n - a.length; i++) s += '<i class="n"></i>'; a.forEach(r => s += `<i class="${r}"></i>`); return s + '</span>'; };
function kick(iso, opts){
  const d = new Date(iso);
  try { return d.toLocaleString([], Object.assign({weekday:'short', hour:'numeric', minute:'2-digit', timeZoneName:'short'}, opts || {})); }
  catch(e){ return iso; }
}
function rankCls(r){ return r == null ? '' : r <= 8 ? 'good' : r >= 25 ? 'bad' : ''; }
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => t.hidden = true, 2400); }
function spark(series, o){
  o = o || {}; const w = o.w || 104, h = o.h || 30, pad = 3;
  const vals = series.map(s => s[1]); if (!vals.length) return '';
  const all = o.base != null ? vals.concat([o.base]) : vals.slice();
  let lo = Math.min.apply(null, all), hi = Math.max.apply(null, all); if (hi === lo){ hi += 1; lo -= 1; }
  const x = i => pad + i * (w - 2 * pad) / Math.max(1, vals.length - 1);
  const y = v => h - pad - (v - lo) * (h - 2 * pad) / (hi - lo);
  const pts = vals.map((v, i) => x(i).toFixed(1) + ',' + y(v).toFixed(1));
  const area = 'M' + x(0).toFixed(1) + ',' + (h - pad) + ' L' + pts.join(' L') + ' L' + x(vals.length - 1).toFixed(1) + ',' + (h - pad) + ' Z';
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-hidden="true"><path d="${area}" class="spark-area"/>` +
    (o.base != null ? `<line x1="${pad}" x2="${w - pad}" y1="${y(o.base).toFixed(1)}" y2="${y(o.base).toFixed(1)}" class="spark-base"/>` : '') +
    `<polyline points="${pts.join(' ')}" class="spark-line"/><circle cx="${x(vals.length - 1).toFixed(1)}" cy="${y(vals[vals.length - 1]).toFixed(1)}" r="2.8" class="spark-end"/></svg>`;
}
function xLink(name){ return 'https://x.com/search?q=' + encodeURIComponent('"' + name + '" injury') + '&f=live'; }

/* ---------- injuries: each team's NEXT game, official report + ESPN's feed ----------
   The build runs this same merge (pipeline/injuries.py); the page re-runs it against ESPN's live feed every few
   minutes so statuses don't wait for the next data refresh. Keep the two in step (research/inj_parity.py checks). */
/* inj-merge:start */
const INJ_HOUR = 3600 * 1000;
const INJ_ORDER = {out: 0, doubt: 1, risk: 2, gtd: 3, likely: 4, ir: 5, ok: 6};
const INJ_SUFFIX = /\s+(jr|sr|ii|iii|iv|v)\.?$/;
const INJ_LONG_ES = ['Injured Reserve', 'Suspension', 'Physically Unable', 'Non-Football', 'Reserve'];
const INJ_LONG_FS = ['IR', 'PUP', 'NFI', 'RESERVE', 'SUSP'];
const injAscii = s => String(s == null ? '' : s).normalize('NFKD').replace(/[^\x00-\x7f]/g, '');
const injNorm = n => injAscii(n).toLowerCase().trim().replace(INJ_SUFFIX, '').replace(/[^a-z]/g, '');
function injAlt(n){
  const parts = injAscii(n).toLowerCase().trim().replace(INJ_SUFFIX, '').split(/\s+/).filter(Boolean);
  return parts.length < 2 ? null : parts[parts.length - 1].replace(/[^a-z]/g, '') + '|' + parts[0].slice(0, 1);
}
function injMs(iso){
  if (!iso) return null;
  let t = Date.parse(iso);
  if (isNaN(t)) t = Date.parse(String(iso).replace(/T(\d\d:\d\d)Z$/, 'T$1:00Z'));
  return isNaN(t) ? null : t;
}
const injGe = (a, b) => a != null && b != null && a >= b;
function parseEspnInj(j, name2ab, espnAbbr, valid){
  const out = [];
  for (const team of (j && j.injuries) || []){
    const t = name2ab[team.displayName || ''];
    for (const it of team.injuries || []){
      try {
        const ath = it.athlete || {}, name = ath.displayName || ath.fullName;
        let tt = t;
        if (!tt){ let ab = (ath.team || {}).abbreviation; ab = espnAbbr[ab] || ab; tt = valid(ab) ? ab : null; }
        if (!name || !tt) continue;
        const det = it.details || {}, typ = det.type;
        out.push({team: tt, name, pos: (ath.position || {}).abbreviation || null,
          es: String(it.status || ((it.type || {}).description || '')).trim(),
          fs: String(((det.fantasyStatus || {}).abbreviation) || '').toUpperCase(),
          ret: det.returnDate || null, date: it.date || null,
          injury: typ != null && !['Not Specified', 'Undisclosed', 'Inactive'].includes(typ) ? typ : null});
      } catch(err){ /* skip a malformed entry */ }
    }
  }
  return out;
}
function injRetWeek(ctx, date){
  if (!date) return null;
  const d = String(date).slice(0, 10);
  for (const [gd, wk] of ctx.sched) if (gd >= d) return wk;
  return null;
}
const injIsLong = e => !!e && (INJ_LONG_ES.some(k => e.es.includes(k)) || INJ_LONG_FS.some(p => e.fs.startsWith(p)));
function injLongLabel(e){
  const es = (e && e.es) || '', fs = (e && e.fs) || '';
  if (es.includes('Suspension') || fs.includes('SUS')) return 'Suspended';
  if (es.includes('Physically Unable') || fs.startsWith('PUP')) return 'On PUP';
  if (es.includes('Non-Football') || fs.startsWith('NFI')) return 'On the NFI list';
  if (es.includes('Injured Reserve') || fs.startsWith('IR')) return 'On IR';
  return 'On a reserve list';
}
function injEspnCat(e, rw, W){
  if (!e || e.es === 'Active') return null;
  const fs = e.fs, es = e.es, later = rw != null && rw > W, soon = rw != null && rw <= W;
  if (fs === 'INACTIVE') return later ? 'out' : null;
  if (later) return 'out';
  if (fs === 'OUT' || (!fs && es === 'Out')) return soon ? 'risk' : 'out';
  if (fs === 'DOUBTFUL' || es === 'Doubtful') return 'doubt';
  return 'gtd';
}
function injPracText(prac, gs){
  if (gs === 'Questionable') return ({FP: 'Questionable, practiced fully', LP: 'Questionable, limited in practice', DNP: 'Questionable, did not practice'})[prac] || 'Questionable';
  return ({FP: 'Full practice, expected to play', LP: 'Limited in practice, game-time call', DNP: 'Did not practice, in doubt'})[prac] || 'On the injury report';
}
function injDecide(ctx, o, e, inRes, now){
  const W = ctx.wk, K = ctx.k, t0 = ctx.t0, t1 = ctx.t1;
  const es = (e && e.es) || '', fs = (e && e.fs) || '';
  const ed = e ? injMs(e.date) : null, rw = e ? injRetWeek(ctx, e.ret) : null;
  const long = injIsLong(e) || (!e && inRes), lbl = e ? injLongLabel(e) : 'On a reserve list';
  if (injGe(ed, K != null ? K - 3 * INJ_HOUR : null) && !long){
    if (es === 'Out' || fs === 'OUT' || fs === 'INACTIVE') return ['out', fs === 'INACTIVE' ? `Inactive for Week ${W}` : `Ruled out for Week ${W}`];
    if (es === 'Active' && o && (o.gs === 'Questionable' || o.gs === 'Doubtful')) return ['ok', `Active for Week ${W}, cleared to play`];
  }
  if (long){
    if (o && (o.practice === 'FP' || o.practice === 'LP')) return [o.practice === 'FP' ? 'likely' : 'gtd', `Back at practice from ${lbl === 'On IR' ? 'IR' : 'a reserve list'} (${o.practice === 'FP' ? 'full' : 'limited'}), could be activated`];
    if (rw != null && rw > W) return ['ir', `${lbl}, expected back Week ${rw}`];
    if (rw != null && rw === W) return ['ir', `${lbl}, could return Week ${W}`];
    return ['ir', lbl];
  }
  const cat = injEspnCat(e, rw, W);
  if (o){
    const prac = o.practice, gs = o.gs, why = (o.injury || '').toLowerCase();
    const finalOut = (ctx.rep || []).some(r => r.gs) || injGe(now, t1 != null ? t1 + 2 * INJ_HOUR : null);
    if (gs === 'Out') return ['out', `Ruled out for Week ${W}`];
    if (injGe(ed, t1) && es !== 'Active' && (fs === 'OUT' || fs === 'INACTIVE' || (es === 'Out' && fs !== 'QUESTIONABLE' && fs !== 'DOUBTFUL'))) return ['out', `Downgraded to out for Week ${W}`];
    if (gs === 'Doubtful') return ['doubt', `Doubtful for Week ${W}` + (({DNP: ', did not practice', LP: ', limited in practice'})[prac] || '')];
    if (why.includes('resting player')) return ['likely', 'Rest day, not injured'];
    if (!gs && !finalOut){
      if (cat === 'out' && prac !== 'FP' && prac !== 'LP') return ['out', `Expected to miss Week ${W}` + (rw && rw > W ? `, back around Week ${rw}` : '')];
      if (cat === 'doubt' && prac !== 'FP' && prac !== 'LP') return ['doubt', `Doubtful for Week ${W}`];
    }
    if (why.includes('personal matter') && gs !== 'Questionable') return ['gtd', 'Personal matter'];
    if (!gs && finalOut) return ['likely', 'No game status, expected to play'];
    return [({FP: 'likely', LP: 'gtd', DNP: 'risk'})[prac] || 'gtd', injPracText(prac, gs)];
  }
  if (cat == null) return null;
  if (ctx.rep != null && !injGe(ed, t0)) return null;   // the team filed this week's report without him and ESPN has nothing newer
  if (cat === 'out') return ['out', `Expected to miss Week ${W}` + (rw && rw > W ? `, back around Week ${rw}` : '')];
  if (cat === 'doubt') return ['doubt', `Doubtful for Week ${W}`];
  if (cat === 'risk') return ['risk', `In doubt for Week ${W}, could be back by then`];
  return ['gtd', `Questionable for Week ${W}`];
}
function mergeTeamInj(ctx, items, now){
  const byN = new Map(), byAlt = new Map();
  for (const e of items){
    const k = injNorm(e.name);
    if (byN.has(k) && (injMs(byN.get(k).date) || 0) >= (injMs(e.date) || 0)) continue;
    byN.set(k, e);
  }
  for (const [k, e] of byN){ const a = injAlt(e.name); if (a) byAlt.set(a, byAlt.has(a) ? null : k); }
  const used = new Set(), out = [];
  const key = new Set(ctx.key), skill = new Set(ctx.skill), res = new Map((ctx.res || []).map(r => [injNorm(r[0]), r]));
  const emit = (name, pos, injury, o, e, k) => {
    const r = injDecide(ctx, o, e, res.has(k), now);
    if (!r) return;
    out.push({name, pos, injury, status: o ? o.gs : null, practice: o ? o.practice : null, level: r[0], outlook: r[1],
      ret_wk: e ? injRetWeek(ctx, e.ret) : null, key: key.has(k), skill: skill.has(k),
      upd: e && e.es !== 'Active' ? e.date : null, src: o ? 'report' : (e ? 'espn' : 'roster')});
  };
  for (const o of ctx.rep || []){
    const k = injNorm(o.name);
    let e = byN.get(k);
    if (!e){ const ek = byAlt.get(injAlt(o.name)); if (ek && !used.has(ek)){ e = byN.get(ek); used.add(ek); } }
    used.add(k);
    const inj = (o.injury || '').replace(/^Not injury related\s*-\s*/i, '') || (e ? e.injury : null);
    emit(o.name, o.pos || (e ? e.pos : null) || null, inj || null, o, e || null, k);
  }
  for (const [k, e] of byN){ if (used.has(k) || e.es === 'Active') continue; used.add(k); emit(e.name, e.pos, e.injury, null, e, k); }
  for (const [k, r] of res){ if (used.has(k) || byN.has(k)) continue; emit(r[0], r[1] || null, null, null, null, k); }
  const ord = l => INJ_ORDER[l] ?? 9;
  out.sort((a, b) => (a.key === b.key ? 0 : a.key ? -1 : 1) || ord(a.level) - ord(b.level) || (a.name < b.name ? -1 : a.name > b.name ? 1 : 0));
  return out;
}
/* inj-merge:end */
let INJ_IDX = {};
function buildInjIdx(){ INJ_IDX = {}; Object.entries(D.injuries || {}).forEach(([t, lst]) => lst.forEach(i => { INJ_IDX[t + '|' + injNorm(i.name)] = i; })); }
buildInjIdx();
/* the current status for any player object with a team and name (falls back to what the build attached) */
function injOf(x){ return !x ? null : D.inj_ctx ? (INJ_IDX[x.team + '|' + injNorm(x.name)] || null) : (x.inj || null); }
function injPill(x, lead){
  const i = injOf(x);
  return i && !['likely', 'ok'].includes(i.level) ? `${lead ? ' ' : ''}<span class="pill lvl-${i.level}">${esc(i.outlook.split(',')[0])}</span>` : '';
}

/* ---------- +/− steppers: phone keypads often have no minus or plus key ---------- */
// kind: odds (American, steps of 5, skips -100..+100), spread (0.5, either sign), line (1, so .5 lines stay .5), units (0.25, min 0.25)
function stepWrap(input, kind){
  const flip = kind === 'odds' || kind === 'spread';
  return `<span class="stp" data-kind="${kind}"><button type="button" class="stp-b" data-stp="-1" aria-label="Lower">−</button>${input}<button type="button" class="stp-b" data-stp="1" aria-label="Higher">+</button>${flip ? '<button type="button" class="stp-b stp-f" data-stp="flip" aria-label="Switch between plus and minus">+/−</button>' : ''}</span>`;
}
const numOf = v => { const t = String(v == null ? '' : v).trim().replace(/[−–]/g, '-').replace(/^\+/, ''); return t === '' || isNaN(t) ? null : Number(t); };
function stepInput(btn){
  const box = btn.closest('.stp'), inp = box && box.querySelector('input'); if (!inp) return;
  const kind = box.dataset.kind, act = btn.dataset.stp, cur = numOf(inp.value);
  let v;
  if (kind === 'odds'){
    let base = cur != null && Math.abs(cur) >= 100 ? cur : (numOf(inp.placeholder) ?? -110);
    if (cur == null && Math.abs(base) >= 100) base = Math.round(base / 5) * 5;
    if (act === 'flip') v = cur == null ? -Math.abs(base) : -cur;
    else if (cur == null || Math.abs(cur) < 100) v = base;
    else { v = cur + 5 * Number(act); if (cur < 0 && v > -100) v = 100; else if (cur > 0 && v < 100) v = -105; }
    inp.value = v > 0 ? '+' + v : String(v);
  } else {
    const step = kind === 'units' ? 0.25 : kind === 'line' ? 1 : 0.5;
    const base = cur != null ? cur : (inp.dataset.proj && !isNaN(inp.dataset.proj) ? Math.floor(Number(inp.dataset.proj)) + 0.5 : (numOf(inp.placeholder) ?? (kind === 'units' ? 1 : 0)));
    if (act === 'flip') v = -(cur ?? base);
    else if (cur == null) v = base;
    else v = cur + step * Number(act);
    if (kind === 'line') v = Math.max(0, v);
    if (kind === 'units') v = Math.max(0.25, v);
    inp.value = String(Math.round(v * 100) / 100);
  }
  inp.dispatchEvent(new Event('input', {bubbles: true}));
  inp.dispatchEvent(new Event('change', {bubbles: true}));
}

/* ---------- header ---------- */
$('#m-week').innerHTML = `<strong>Week ${WEEK}</strong> · ${D.meta.season} season`;
function ago(iso){ const m = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 60000)); return m < 1 ? 'just now' : m < 60 ? m + ' min ago' : m < 1440 ? Math.round(m / 60) + ' hr ago' : Math.round(m / 1440) + ' days ago'; }
function renderAsof(){ $('#m-asof').innerHTML = `Updated <strong>${ago(D.meta.asof)}</strong>${D.meta.stats_through ? `<span class="xs-hide"> · box scores through ${esc(new Date(D.meta.stats_through + 'T12:00:00').toLocaleDateString([], {weekday: 'short', month: 'short', day: 'numeric'}))}</span>` : ''}`;
  $('#m-asof2').innerHTML = `<strong>Week ${WEEK}</strong> · updated ${ago(D.meta.asof)}`; }

const PROP_LABEL = {pass_yds: 'Pass yds', rush_yds: 'Rush yds', rec_yds: 'Rec yds', receptions: 'Receptions', any_td: 'Anytime TD'};

function survChance(key, proj, t){
  const dist = (D.prop_dist || {})[key]; if (!dist) return null;
  const grid = dist.grid, bins = dist.bins, cs = bins.map(b => b.center);
  const surv = b => { if (t <= grid[0]) return b.surv[0]; if (t >= grid[grid.length - 1]) return b.surv[b.surv.length - 1];
    let j = 0; while (grid[j + 1] < t) j++; const w = (t - grid[j]) / (grid[j + 1] - grid[j]); return b.surv[j] * (1 - w) + b.surv[j + 1] * w; };
  if (proj <= cs[0]) return surv(bins[0]); if (proj >= cs[cs.length - 1]) return surv(bins[bins.length - 1]);
  let k = 0; while (cs[k + 1] < proj) k++; const w = (proj - cs[k]) / (cs[k + 1] - cs[k]);
  return surv(bins[k]) * (1 - w) + surv(bins[k + 1]) * w;
}
function overChance(key, proj, line){
  if (proj != null && line !== '' && !isNaN(line) && D.prop_dist && D.prop_dist[key]) return survChance(key, proj, Math.floor(Number(line)) + 1);
  const bins = D.prop_bins[key]; if (!bins || proj == null || line === '' || isNaN(line)) return null;
  line = Number(line);
  let b = bins.find(b => proj >= b.lo && proj <= b.hi) || (proj < bins[0].lo ? bins[0] : bins[bins.length - 1]);
  const q = b.q.map(v => Math.max(0, v + (proj - b.center)));
  const ps = q.map((_, i) => 0.05 + i * 0.05);
  if (line < q[0]) return 0.96; if (line > q[q.length - 1]) return 0.04;
  for (let i = 0; i < q.length - 1; i++){
    if (line >= q[i] && line <= q[i + 1]){ const t = (line - q[i]) / ((q[i + 1] - q[i]) || 1); return 1 - (ps[i] + t * (ps[i + 1] - ps[i])); }

}

function parseOdds(v){
  const t = String(v == null ? '' : v).trim().replace(/[\u2212\u2013]/g, '-').replace(/^\+/, '');
  if (!t) return null; const o = Number(t); return isFinite(o) && Math.abs(o) >= 100 ? o : null;

  const ev = evOf(p, o), c = Math.round(ev * 100);

  if (ev >= 0) return {t: `Thin edge: +${c}\u00a2 per $1, inside the model's margin of error`, c: 'thin'};

const {ncdf, dec, impProb, uid, unitsTxt} = SE;
const RESID = D.meta.resid_sd || 12.95, RESID_T = 13.6;   // typical miss on a margin and on a game total, in points
const TEASE = 6;
const gameOf = id => D.games.find(x => x.id === id);
D.grade.pkey = 'wk';

/* ---------- what the model thinks a leg's chance is ---------- */
function modelPFor(l){
  const g = gameOf(l.game); if (!g || g.final) return null;
  const m = g.model, home = l.team === g.home, half = L => Number.isInteger(Number(L)) ? 0.5 : 0, L = l.line == null || l.line === '' ? null : Number(l.line);
  if (l.market === 'spread'){
    if (L == null) return null;
    if (l.tease && l.from != null){                      // Wong teaser legs: the historical rate beats a bell curve through 3 and 7
      const TS_ = ((D.research || {}).spread || {}).teaser || {};
      if (l.from >= 1.5 && l.from <= 2.5 && TS_.dog_leg) return (g.total || 99) <= 49 && TS_.dog_leg_lowtotal ? TS_.dog_leg_lowtotal : TS_.dog_leg;
      if (l.from <= -7.5 && l.from >= -8.5 && TS_.fav_leg) return TS_.fav_leg;
    }
    const mm = home ? m.margin : -m.margin;
    return ncdf((mm + L - half(L)) / RESID);
  }
  if (l.market === 'ml') return home ? m.wp_home : 1 - m.wp_home;
  if (l.market === 'total'){
    if (L == null || m.total == null) return null;
    return l.side === 'U' ? ncdf((L - half(L) - m.total) / RESID_T) : 1 - ncdf((L + half(L) - m.total) / RESID_T);
  }
  const def = SB.MK.nfl[l.market];
  if (def && def.cat === 'Player' && l.player){
    const pr = (g.props || []).find(x => x.id === l.player);
    if (l.market === 'first_td' || l.market === 'td2'){ const ls = ((D.long_shots || {}).picks || []).find(x => x.id === l.player && x.game === g.id && x.type === l.market); return ls ? ls.p : null; }
    if (!pr || !PP_TYPES[l.market]) return null;
    const c = propChance(pr, l.market, L); if (!c) return null;
    return l.side === 'U' ? c.under : c.over;
  }
  return null;
}

function spreadTests(S){
  if (!S || !S.variants) return '';
  const order = ['Current model', 'Opponent-adjusted efficiency', 'Garbage time removed', 'Recent games weighted more', 'Starting QB rating added', 'Rest, travel and situation added', 'Pressure rates added', 'All of the above'];
  const label = {'Current model': 'Stats only (first version)', 'Opponent-adjusted efficiency': 'Adjusted for opponent strength', 'Garbage time removed': 'Garbage time removed',
    'Recent games weighted more': 'Recent games weighted more', 'Starting QB rating added': 'Starting-QB rating added', 'Rest, travel and situation added': 'Rest, travel and situation added',
    'Pressure rates added': 'Pass-rush and pass-block pressure added', 'All of the above': 'All combined'};
  const rows = order.filter(k => S.variants[k]).map(k => { const v = S.variants[k];
    return `<tr><td style="white-space:normal">${label[k]}</td><td class="r num">${pct(v.su, 1)}</td><td class="r num">${pct(v['0'].pct, 1)}</td><td class="r num">${pct(v['3.0'].pct, 1)}</td></tr>`; }).join('');
  const T_ = S.teaser, K = S.key, sp = S.splits || {};
  return `<div class="sec-head"><div><h2 class="h3">Can it beat the spread?</h2><p class="lede">Each fix tested on ${(S.variants['Current model']['0'].w + S.variants['Current model']['0'].l).toLocaleString()} games from 2020–2025, predicting each season only from earlier ones. Fixes that help pick winners don't help against the spread, because the betting line already prices them in.</p></div></div>
    <div class="tbl-wrap"><table class="grid"><thead><tr><th>Version</th><th class="r">Picks winners</th><th class="r">Covers, all games</th><th class="r">Covers, 3+ pt edge</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="facts">
      <div class="fact"><div class="label">Half a point at 3</div><div class="v">${pct(K.p_fav_by_3_when_line_near_3)}</div><p>Games lined near 3 that the favorite won by exactly 3. Getting +3.5 instead of +3 turns those pushes into wins, so shopping for the better number beats any model tweak.</p></div>
      <div class="fact"><div class="label">Teaser legs: underdogs</div><div class="v">${pct(T_.dog_leg, 1)}</div><p>Six-point teasers taking +1.5 to +2.5 underdogs up through 3 and 7 won ${pct(T_.dog_leg, 1)} of legs (${T_.dog_n} games, 2018–25; ${pct(T_.dog_leg_lowtotal, 1)} when the total was 49 or less). A two-team teaser at −120 needs ${pct(T_.breakeven_2team_minus120, 1)} per leg.</p></div>
      <div class="fact"><div class="label">Teaser legs: favorites</div><div class="v">${pct(T_.fav_leg, 1)}</div><p>Teasing −7.5 to −8.5 favorites down to −1.5 or −2.5 won ${pct(T_.fav_leg, 1)} of legs (${T_.fav_n} games), below break-even.</p></div>
      <div class="fact"><div class="label">Worth watching</div><div class="v">${pct((sp['Road underdogs'] || {}).rate, 1)}</div><p>Road underdogs' cover rate, 2018–25 (${((sp['Road underdogs'] || {}).n || 0).toLocaleString()} games). Division underdogs: ${pct((sp['Division underdogs'] || {}).rate, 1)}. Close to break-even, so not proven.</p></div>
    </div>`;
}

const NAME2AB = {}; Object.values(T).forEach(t => { NAME2AB[t.city + ' ' + t.nick] = t.abbr; });
let liveTimer = null;
async function liveScores(){
  try {
    const ctl = new AbortController(); const tm = setTimeout(() => ctl.abort(), 7000);
    const r = await fetch('https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard', {signal: ctl.signal, cache: 'no-store'});
    clearTimeout(tm); if (!r.ok) return;
    const j = await r.json(); let changed = false, anyLive = false;
    (j.events || []).forEach(ev => {
      const comp = (ev.competitions || [])[0]; if (!comp) return;
      const cs = comp.competitors || []; const h = cs.find(c => c.homeAway === 'home'), a = cs.find(c => c.homeAway === 'away'); if (!h || !a) return;
      const ha = NAME2AB[(h.team || {}).displayName], aa = NAME2AB[(a.team || {}).displayName]; if (!ha || !aa) return;
      const st = ((comp.status || ev.status || {}).type) || {}; const hs = parseInt(h.score, 10), as = parseInt(a.score, 10);
      const g = D.games.find(x => x.home === ha && x.away === aa);
      if (g && st.state === 'in'){ g.live = {detail: st.shortDetail || st.detail || 'In progress', home_score: hs, away_score: as}; anyLive = true; changed = true; }
      if (st.state === 'post' && st.completed && !isNaN(hs)){
        if (g && !g.final){ g.final = true; g.live = null; g.home_score = hs; g.away_score = as; changed = true; }
        const gg = Object.values(D.grade.games).find(x => x.h === ha && x.a === aa && x.hs == null && (!g || x.wk === g.week));
        if (gg){ gg.hs = hs; gg.as = as; changed = true; }
      }
    });
    if (changed){ if (!$('#v-week').hidden && !$$('.g-detail').some(d => !d.hidden)) renderWeek(); renderModel(); SB.renderBets(); }
    clearTimeout(liveTimer);
    if (anyLive) liveTimer = setTimeout(() => { if (!document.hidden) liveScores(); }, 60000);
  } catch(e){ /* live scores are a bonus; the published data still loads */ }
}

    const det = card.querySelector('.g-detail');
    if (det && !det.hidden && !det.contains(document.activeElement)){
      const on = det.querySelector('[data-dtab][aria-pressed="true"]');
      if (on && (on.dataset.dtab === 'inj' || on.dataset.dtab === 'props')) det.innerHTML = detailHtml(g, on.dataset.dtab);
    }
  });
  // other sections redraw now if they're out of sight or nobody is typing in them, otherwise the next time they're opened
  const busy = !$('#sheet').hidden || !$('#navsheet').hidden || (CH && !$('#csheet').hidden);
  [['hc', renderHC], ['ls', renderLS], ['trends', renderTrends], ['props', renderProps], ['tips', renderTips]].forEach(([k, fn]) => {
    const v = $('#v-' + k);
    if (!v) return;
    if (v.hidden){ if (k === 'hc' || k === 'ls' || k === 'trends') fn(); return; }
    if (busy || v.contains(document.activeElement)) INJ_STALE.add(k); else fn();
  });
}
async function liveInjuries(){
  if (!D.inj_ctx || INJ_BUSY) return;
  INJ_BUSY = true;
  try {
    const ctl = new AbortController(); const tm = setTimeout(() => ctl.abort(), 15000);
    const r = await fetch('https://site.api.espn.com/apis/site/v2/sports/football/nfl/injuries', {signal: ctl.signal, cache: 'no-store'});
    clearTimeout(tm); if (!r.ok) throw new Error('HTTP ' + r.status);
    const items = parseEspnInj(await r.json(), NAME2AB, {WSH: 'WAS', LAR: 'LA', JAC: 'JAX'}, ab => !!T[ab]);
    if (items.length < 100) throw new Error('partial feed');      // never let a half-empty answer clear real injuries
    const by = {}; items.forEach(e => { (by[e.team] = by[e.team] || []).push(e); });
    const before = injSig(), now = Date.now();
    Object.keys(D.inj_ctx).forEach(t => { D.injuries[t] = mergeTeamInj(D.inj_ctx[t], by[t] || [], now); });
    buildInjIdx(); INJ_LIVE_AT = now; INJ_LIVE_ERR = false;
    if (injSig() !== before) injChanged();
  } catch(e){ INJ_LIVE_ERR = true; }
  INJ_BUSY = false;
  injStamp();
}
setInterval(() => { injStamp(); if (!document.hidden && (!INJ_LIVE_AT || Date.now() - INJ_LIVE_AT >= 4.5 * 60000)) liveInjuries(); }, 60000);
async function checkForNewData(){
  if (Date.now() - LOADED_AT < 10 * 60000) return;
  try {
    const r = await fetch(DATA_URL + '?t=' + Date.now(), {cache: 'no-store'}); if (!r.ok) return;
    const j = await r.json(); LOADED_AT = Date.now();
    if (j.meta.asof !== D.meta.asof && !$('#fresh')){
      const b = document.createElement('div'); b.id = 'fresh'; b.className = 'toast'; b.setAttribute('role', 'status');
      b.innerHTML = 'Newer numbers are available. <button class="btn tiny stripe" style="margin-left:8px" id="fresh-go">Reload</button>';
      document.body.appendChild(b); $('#fresh-go').addEventListener('click', () => location.reload());
    }
  } catch(e){}
}
document.addEventListener('visibilitychange', () => { if (!document.hidden){ checkForNewData(); liveScores(); if (!INJ_LIVE_AT || Date.now() - INJ_LIVE_AT > 2 * 60000) liveInjuries(); } });

/* ---------- boot ---------- */
initPicks();
renderWeek(); renderModel(); renderHC(); renderLS(); renderTrends(); renderMatters();
const startTab = location.hash.replace('#', '') || store.get('tab', 'week');
if (startTab.startsWith('g-')){                          // a game linked from the home page: open it on This week
  const gid = decodeURIComponent(startTab.slice(2));
  if (D.games.some(g => g.id === gid)){ weekFilter = 'all'; GOPEN.add(gid); show('week'); renderWeek();
    setTimeout(() => { const el = document.getElementById('g-' + gid); if (el){ el.scrollIntoView({block: 'start'}); const b = el.querySelector('[data-more]'); if (b && b.getAttribute('aria-expanded') === 'false') b.click(); } }, 80); }
} else if (['week', 'props', 'model', 'hc', 'ls', 'trends', 'picks', 'tips', 'matters', 'teams'].includes(startTab) && startTab !== 'week') show(startTab);
liveScores();
liveInjuries();
})();
</script>
