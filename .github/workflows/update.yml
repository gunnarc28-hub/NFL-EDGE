name: Update NFL Edge

on:
  schedule:
    # every 30 minutes, August through February (times are UTC)
    - cron: "7,37 * * 1,2,8,9,10,11,12 *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: [".heartbeat", "README.md"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: nfl-edge-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install
        run: pip install -r pipeline/requirements.txt

      - name: Build the latest data
        run: python pipeline/build.py

      - name: Daily heartbeat commit (keeps GitHub from pausing the schedule)
        run: |
          today=$(date -u +%Y-%m-%d)
          if [ "$(cat .heartbeat 2>/dev/null)" != "$today" ]; then
            echo "$today" > .heartbeat
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .heartbeat
            git commit -m "Data refresh heartbeat $today" && git push || echo "heartbeat skipped"
          fi

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
