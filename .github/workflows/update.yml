name: Update Sports Edge

on:
  schedule:
    # every 30 minutes, all year (times are UTC); a sport with no games just rebuilds its off-season page
    - cron: "7,37 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: [".heartbeat", "README.md"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sports-edge-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install
        run: pip install -r pipeline/requirements.txt

      # Each sport builds on its own. If one fails, the site keeps that sport's last good numbers
      # (downloaded here from the live site) and the other sports still update.
      - name: Start from the live site's numbers
        run: |
          base="https://gunnarc28-hub.github.io/NFL-EDGE"
          for s in nfl nba nhl; do
            mkdir -p "site/$s/data"
            for f in data.json logs.json grade.json summary.json odds_log.json parts_log.json; do
              if curl -fsSL --retry 2 --max-time 60 "$base/$s/data/$f?t=$(date +%s)" -o "site/$s/data/$f.live"; then
                mv "site/$s/data/$f.live" "site/$s/data/$f"
              else
                rm -f "site/$s/data/$f.live"
              fi
            done
          done

      - name: Build NFL
        id: nfl
        continue-on-error: true
        timeout-minutes: 15
        run: |
          set -o pipefail
          python pipeline/build.py 2>&1 | tee nfl.log

      - name: Build NBA
        id: nba
        continue-on-error: true
        timeout-minutes: 15
        run: |
          set -o pipefail
          python pipeline/nba.py 2>&1 | tee nba.log

      - name: Build NHL
        id: nhl
        continue-on-error: true
        timeout-minutes: 15
        run: |
          set -o pipefail
          python pipeline/nhl.py 2>&1 | tee nhl.log

      - name: Report each sport
        if: always()
        run: |
          note() { tail -n "$3" "$2" 2>/dev/null | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g'; }
          for s in nfl nba nhl; do
            case $s in nfl) o="${{ steps.nfl.outcome }}";; nba) o="${{ steps.nba.outcome }}";; nhl) o="${{ steps.nhl.outcome }}";; esac
            S=$(echo $s | tr a-z A-Z)
            if [ "$o" = "success" ]; then echo "::notice title=$S updated::$(note $s $s.log 12)";
            else echo "::error title=$S build $o (the site keeps its last good numbers)::$(note $s $s.log 25)"; fi
          done
          for s in nfl nba nhl; do
            test -s "site/$s/data/data.json" || { echo "::error::No $s numbers at all, not deploying"; exit 1; }
          done

      - name: Daily heartbeat commit (keeps GitHub from pausing the schedule)
        run: |
          today=$(date -u +%Y-%m-%d)
          if [ "$(cat .heartbeat 2>/dev/null)" != "$today" ]; then
            echo "$today" > .heartbeat
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .heartbeat
            git commit -m "Data refresh heartbeat $today" && git push || echo "heartbeat skipped"
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # A quick look at the live site after each deploy: every page and each sport's numbers load and are fresh.
  check:
    needs: deploy
    runs-on: ubuntu-24.04            # Playwright's browser installer knows this image; ubuntu-latest is moving to 26.04
    timeout-minutes: 15
    steps:
      - name: Check the live pages
        run: |
          base="https://gunnarc28-hub.github.io/NFL-EDGE"
          sleep 30
          bad=0; out=""
          for p in "" nfl/ nba/ nhl/ assets/app.js assets/bets.js assets/core.js assets/home.js assets/parts.js assets/app.css; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$base/$p?t=$(date +%s)")
            [ "$code" = "200" ] || { bad=1; echo "::warning title=Live page missing::$base/$p returned $code"; }
          done
          for s in nfl nba nhl; do
            asof=$(curl -fsS --max-time 30 "$base/$s/data/summary.json?t=$(date +%s)" | python3 -c "import sys, json; print(json.load(sys.stdin).get('asof', '?'))" 2>/dev/null || echo "missing")
            out="$out $s=$asof"
          done
          echo "::notice title=Live site::numbers as of$out"

      # After a code change (not the half-hourly refresh), also click through every page in a phone-sized browser.
      - uses: actions/checkout@v4
        if: github.event_name != 'schedule'
      - uses: actions/setup-python@v5
        if: github.event_name != 'schedule'
        with:
          python-version: "3.13"
      - name: Click through every page
        if: github.event_name != 'schedule'
        continue-on-error: true
        run: |
          # any failure lands in the run's summary with the last lines of its output
          note() { tail -n "$2" "$1" 2>/dev/null | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g'; }
          { pip install -q playwright==1.56.0 && python -m playwright install --with-deps chromium; } > setup.log 2>&1 \
            || { echo "::warning title=Site check could not install its browser::$(note setup.log 25)"; exit 1; }
          python pipeline/check_site.py "https://gunnarc28-hub.github.io/NFL-EDGE/" 2> check.err \
            || { echo "::warning title=Site check stopped::$(note check.err 25)"; exit 1; }
